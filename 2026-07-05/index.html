<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2026-07-05 科普绘本《七颗苹果去新幼儿园》</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #141414;
      color: #f8f4ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #141414;
      overflow: hidden;
    }
    main {
      height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 8px;
      padding: 10px;
    }
    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
      background: #222;
      user-select: none;
      -webkit-user-drag: none;
    }
    nav {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      gap: 12px;
      padding-bottom: max(4px, env(safe-area-inset-bottom));
    }
    button, a {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: #f8f4ec;
      color: #141414;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      display: grid;
      place-items: center;
      touch-action: manipulation;
    }
    button:disabled { opacity: 0.4; }
    .meta {
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
      color: #4a4036;
    }
    .title {
      display: block;
      font-size: 15px;
      color: #141414;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <main>
    <div class="stage">
      <img id="page" src="page-01.png" alt="绘本页面">
    </div>
    <nav aria-label="翻页">
      <button id="prev" type="button" aria-label="上一页">‹</button>
      <a href="../" aria-label="返回目录">
        <span class="meta"><span class="title">七颗苹果去新幼儿园</span><span id="counter">1 / 10</span></span>
      </a>
      <button id="next" type="button" aria-label="下一页">›</button>
    </nav>
  </main>
  <script>
    const total = 10;
    let page = 1;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    function render() {
      image.src = `page-${String(page).padStart(2, "0")}.png`;
      counter.textContent = `${page} / ${total}`;
      prev.disabled = page === 1;
      next.disabled = page === total;
    }

    function go(delta) {
      page = Math.min(total, Math.max(1, page + delta));
      render();
    }

    prev.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") go(-1);
      if (event.key === "ArrowRight" || event.key === " ") go(1);
    });

    let startX = 0;
    document.addEventListener("touchstart", (event) => {
      startX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const dx = event.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 48) go(dx < 0 ? 1 : -1);
    }, { passive: true });

    render();
  </script>
</body>
</html>
