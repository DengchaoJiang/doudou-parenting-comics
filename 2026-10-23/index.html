<script>const prose=["《小饭团去了哪里》\n松鼠点点咽下一口饭，忽然摸摸肚皮：“爸爸，它怎么不见了？”青岩爸爸放下筷子。点点的肚子里，藏着一个他很想弄明白的秘密。","“它是不是掉到脚底去了？”点点低头找，连椅子下面也看了。爸爸笑着摇头：“没有丢。吃完饭，我们一起画画它走的路。”点点把这个问题小心地留了下来。","饭后，爸爸铺开纸。点点先画一张嘴，又画了一条长长的路，直通脚趾。“等等，”爸爸指指胸前，“吞下去的食物，先经过食道，到胃里。”点点的笔停住了。","“可我明明没有推它呀！”点点把纸转来转去。爸爸找来一块干净软布，松松卷成管子，又把一个大纸团放进去：“这是比方，不是真的身体。我们看看，怎样把它送过去。”","点点只捏住布管的一头，大纸团纹丝不动。他急得翘起尾巴：“小乘客卡住啦！”爸爸没有替他拽出来，而是指着纸团后面：“试试从这里，一段一段地捏。”","点点沿着布管慢慢捏，纸团终于往前走了。“身体里的食道也会这样，一段一段用肌肉推送食物。”爸爸说。点点惊喜地笑了：“原来它自己就会送饭！”","点点擦去通往脚趾的线，画上一个圆鼓鼓的胃。爸爸说，胃会把食物和消化液混在一起，继续弄碎。点点画了几道弯弯的线：“像个轻轻搅拌的小工坊。”","胃后面还连着长长的肠子。爸爸用手指沿着画走：“食物继续消化，许多营养在小肠里被身体吸收。”点点给路边画了小窗：“原来不是整口饭都变成臭臭呀！”","“对，剩下的东西还要经过大肠，最后才排出去。”爸爸说。点点望着自己的路线图，把终点画回厕所，终于放心了：“小饭团没有丢，它去了身体需要它去的地方。”","点点把布管收好，又摸摸肚皮。这回他不找小饭团了，只悄悄说：“谢谢你们，一直帮我送饭的小肌肉。”爸爸和他把图贴在桌旁，留下一块空白，等下一个问题来敲门。"];let current=1;const image=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');function show(n){current=Math.max(1,Math.min(10,n));image.src='page-'+String(current).padStart(2,'0')+'.png';image.alt=prose[current-1];counter.textContent=current+' / 10';prev.disabled=current===1;next.disabled=current===10;}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let touchX=0;image.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>50)show(current+(d<0?1:-1))},{passive:true});show(1);</script></body></html>
