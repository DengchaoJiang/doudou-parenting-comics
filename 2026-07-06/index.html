<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026-07-06 小芒的三张通行卡</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #171512;
      color: #f6f1e7;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: #171512;
    }
    header,
    footer {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 12px 14px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.3;
      font-weight: 650;
    }
    .counter {
      color: #d5c8ad;
      font-size: 14px;
      white-space: nowrap;
    }
    main {
      width: min(100%, 1120px);
      margin: 0 auto;
      padding: 0 10px;
      display: grid;
      place-items: center;
    }
    .stage {
      width: 100%;
      aspect-ratio: 4 / 3;
      max-height: calc(100vh - 118px);
      display: grid;
      place-items: center;
      background: #0f0e0c;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    button,
    a {
      color: inherit;
      font: inherit;
    }
    button {
      min-height: 44px;
      border: 1px solid #5f5444;
      border-radius: 8px;
      background: #29251f;
      padding: 8px 14px;
    }
    button:disabled {
      opacity: 0.42;
    }
    .home {
      justify-self: center;
      color: #d5c8ad;
      text-decoration: none;
      font-size: 14px;
    }
    #prev {
      justify-self: start;
    }
    #next {
      justify-self: end;
    }
  </style>
</head>
<body>
  <header>
    <h1>小芒的三张通行卡</h1>
    <div class="counter"><span id="current">1</span> / 10</div>
  </header>
  <main>
    <div class="stage">
      <img id="page" src="page-01.png" alt="小芒的三张通行卡 第1页">
    </div>
  </main>
  <footer>
    <button id="prev" type="button">上一页</button>
    <a class="home" href="../">返回目录</a>
    <button id="next" type="button">下一页</button>
  </footer>
  <script>
    const total = 10;
    let page = 1;
    const image = document.getElementById("page");
    const current = document.getElementById("current");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    function show(nextPage) {
      page = Math.min(total, Math.max(1, nextPage));
      const label = String(page).padStart(2, "0");
      image.src = `page-${label}.png`;
      image.alt = `小芒的三张通行卡 第${page}页`;
      current.textContent = page;
      prev.disabled = page === 1;
      next.disabled = page === total;
    }

    prev.addEventListener("click", () => show(page - 1));
    next.addEventListener("click", () => show(page + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(page - 1);
      if (event.key === "ArrowRight") show(page + 1);
    });
    image.addEventListener("click", () => show(page < total ? page + 1 : 1));
    show(1);
  </script>
</body>
</html>
