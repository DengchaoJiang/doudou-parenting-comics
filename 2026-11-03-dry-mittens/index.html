<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>第二双手套等着你</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f6efdf;color:#493c2d;font-family:system-ui,sans-serif;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:20px}button{width:80px;height:44px;border:0;border-radius:12px;background:#e3d4b9;color:#493c2d;font-size:18px}button:disabled{opacity:.35}#counter{min-width:65px;text-align:center}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main><script>const prose=["小水獭麦麦出门前，爸爸江树把一双橙手套和一双黄手套并排放好。“今天风凉。”爸爸帮他戴上橙手套，把干燥的黄手套装进备用袋。","森林幼儿园里，麦麦和岚老师一起铺树叶小路。篮里的叶子沙沙响。他一片片摆过去，弯弯的小路，快要绕到木桩后面了。","捡起几片湿叶子后，橙手套也潮了。麦麦握握小手，手指凉凉的。他看看没铺完的小路，又看看老师，没有继续往前摆。","他走到岚老师面前：“我的手冷。”老师蹲下来查看。麦麦把手举近一点：“手套里面也湿了，我想换干的。”老师点头：“我们现在就去。”","“可是，小路还差这一点。”麦麦没有松开篮子。老师帮他把篮子放在木桩旁：“树叶先等着。换好手套，我们再回来接着铺。”","回到屋里，老师帮麦麦脱下湿手套，用柔软的干巾轻轻擦干小手。橙手套摊开了，里面也湿湿的，贴着手时确实不舒服。","老师拿来黄手套：“手套帮我们留住身体的暖。湿了以后，热更容易散出去，所以要换干的。”麦麦摸摸干燥的绒里，把手伸了进去。","他们在屋里缓了一会儿，小手渐渐舒服了。老师把湿手套摊开放进透气袋，检查麦麦的衣服和手套，再陪他回到外面。","篮子还在木桩旁，小路也还在。麦麦戴着黄手套，和老师挑着干叶子，把最后一段接起来。“看，树叶等到我啦！”","爸爸来接时，老师把换手套的事告诉他。麦麦也举起小手：“冷了我说了，老师帮我换了。”爸爸牵着他往家走，备用袋里装着那双湿手套。"];let n=0;const pic=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(i){n=Math.max(0,Math.min(9,i));pic.src='page-'+String(n+1).padStart(2,'0')+'.png';pic.alt=prose[n];counter.textContent=(n+1)+' / 10';prev.disabled=n===0;next.disabled=n===9}prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);document.onkeydown=e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)};let startX=0;pic.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});pic.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)show(n+(dx<0?1:-1))},{passive:true});show(0);</script></body></html>
