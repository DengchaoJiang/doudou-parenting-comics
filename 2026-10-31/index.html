const prose=["《纸墙长出小脚》小浣熊点点把红轿车、绿卡车和蓝小巴排成队：“下雨啦，来车棚躲一躲！”爸爸松岳递来两张蓝纸板、一张紫纸。客厅里的小车棚要开门了。", "蓝纸板当墙，紫纸当屋顶。点点松开手，刚要推车，纸墙就歪了，屋顶落在车头上。“变成车被子啦！”他揭下屋顶，再立一次墙，手一离开，墙又倒了。", "“爸爸，你一直扶着嘛。”点点把纸墙交给爸爸，自己推红车往中间开。爸爸扶了一会儿：“我也想开一辆。咱们找找，纸墙怎样能自己站一会儿？”", "爸爸把屋顶和纸墙放平，问：“你站稳的时候，脚怎么放？”点点低头，把两只脚分开些，摇摇尾巴。“站开一点！”他蹲下来，“纸墙也能长脚吗？”", "爸爸沿一面纸墙的下面折出宽边，往外摊在地上。点点扶着，爸爸压好折痕。两个人慢慢松手，它站住了！另一面没折的墙一立起来，却又歪了。", "“它也要一只！”点点按着第二面纸墙，爸爸帮他把下面折齐。两面墙的小脚朝两边摊开，中间留出车道。“像我的脚，底下宽了一点。”点点蹲着看。", "爸爸重新搭上紫屋顶，慢慢张开手掌。墙没有倒，屋顶也没落。点点轻轻拍手：“它们自己站着呢！”红轿车终于往前开了一点，他高兴得尾巴都翘了起来。", "点点拐弯太急，红车碰到左边的纸墙，屋顶滑下来，盖住车尾。“又倒了……”爸爸扶住墙：“刚刚车碰到了。小纸脚能帮它站稳些，可不是怎么撞都不倒。”", "点点退回红车，和爸爸扶正墙、搭回屋顶。这次，他离两边的墙远一点，从中间慢慢开。“别着急，前面有位置。”红车过去了，纸墙还在原处。", "绿卡车、蓝小巴也排队开进去。三辆车停好，紫屋顶稳稳地留在上面。“雨停啦！”爸爸接过蓝小巴：“轮到我开出来喽。”两个人不用扶墙，也能一起当司机了。", "玩完，点点把车一辆辆开出来，爸爸把屋顶放平。两面纸墙排在旁边，小纸脚还摊着。“明天还会站吗？”“明天搭好，再试一试。”点点笑了，把车整齐停好。"];let current=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');
function show(n){current=Math.max(0,Math.min(prose.length-1,n));image.src='page-'+String(current+1).padStart(2,'0')+'.png';image.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let startX;image.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});image.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>50)show(current+(d<0?1:-1))},{passive:true});show(0);
</script></body></html>
