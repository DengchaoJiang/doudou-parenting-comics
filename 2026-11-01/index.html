<script>const prose=["咔嚓声藏哪儿了。小公鸡谷谷和爸爸去吃点心，却发现朋友吃得咔嚓响，自己的嘴里一点声音也没有。他决定找出这个小秘密。", "谷谷端着蓝碗，和爸爸禾川来到苹果树下。兔子蓬蓬抱着胡萝卜，咔嚓，咔嚓。谷谷啄起一粒小麦，咽了下去，等了等：“咦，我的咔嚓声呢？”", "“牙齿是不是忘在家里了？”谷谷张开嘴。爸爸低头看：“没忘，我们鸡本来就没有牙齿。”谷谷捂住蓝碗：“那小麦怎么办？总不能借蓬蓬的牙吧！”", "爸爸牵他坐进树荫：“小麦离开嘴巴，旅行还没结束呢。”谷谷追问：“去哪里？会迷路吗？”爸爸取出纸笔，画了一粒小麦。谷谷添上小脚：“让它走给我看！”", "画上的小麦走进喙，顺着通道往下，先到暂时存放食物的口袋。“这是嗉囊。”爸爸说。谷谷画上箭头：“像停车的地方？”“有点像，不过这里还不磨东西。”", "小麦继续走，先有消化液帮着处理食物，才来到一个结实的地方。爸爸画出厚厚的两边：“这是砂囊，肌肉很强。”谷谷用翅膀比画：“一起挤一挤，把食物磨碎！”", "“像小磨坊！”谷谷添上几粒砂砾。爸爸说：“合适的砂砾能帮鸡磨食物，可它们不是牙齿，砂囊也没长小牙。”谷谷擦掉刚添的尖牙，把厚厚的两边描清楚。", "他画了一粒小麦，又画几小片：“磨过以后变小，再往下走。”风吹起纸角，他忙用蓝碗压住：“等等，还没画完呢！”这回，他不担心嘴巴了，只想画好下一段路。", "蓬蓬走近：“你在修什么路？”谷谷把画推过去：“你用牙齿嚼，我用砂囊磨，身体的办法不一样。”蓬蓬摸摸门牙：“我可不能学鸡吃砂砾。”爸爸点头：“对，要适合自己的身体。”", "点心重新摆好，蓬蓬吃胡萝卜，谷谷啄小麦。咔嚓，又一声。谷谷笑了：“没发出你的声音，不等于食物没在往下走！”他放稳蓝碗，把那张旅行图平平地铺在旁边。", "回家时，谷谷把画卷好交给爸爸：“带好，别让小麦迷路。”爸爸笑了：“图带回家，真的小麦会走自己的路。”蓬蓬挥手，谷谷也挥翅膀。他不用借牙齿了，明天还要接着画。"];let current=0;const img=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){img.src='page-'+String(current+1).padStart(2,'0')+'.png';img.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}prev.onclick=()=>{if(current>0){current--;show()}};next.onclick=()=>{if(current<prose.length-1){current++;show()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()});let touchStart;img.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0].screenX},{passive:true});img.addEventListener('touchend',e=>{const delta=e.changedTouches[0].screenX-touchStart;if(delta>50)prev.click();if(delta< -50)next.click()},{passive:true});show();</script></body></html>
