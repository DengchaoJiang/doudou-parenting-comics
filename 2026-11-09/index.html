<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>风筝回来啦｜2026-11-09</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3e7;color:#233e57;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{height:44px;display:flex;align-items:center;gap:24px;flex-shrink:0}button{height:44px;min-width:88px;border:1px solid #bec9c9;border-radius:9px;background:#fffdf6;color:#233e57;font:inherit}button:disabled{opacity:.35}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>const prose=["小獾松塔抱着蓝色风筝，跟爸爸石桥来到空旷的草地。风筝有一条黄尾巴，像刚睡醒的小鱼。松塔问：“它飞高了，还肯跟我回家吗？”","爸爸把线盘交到松塔手里，自己托住风筝。松塔抬高手臂，风筝却软软地垂下来。草尖一动不动。他有点失望：“小鱼不想游。”","他们没有急着再试。过了一会儿，爸爸的围巾轻轻飘起，草尖也朝一边弯。松塔伸出手：“有东西从我的手背滑过去了！”","“是风来了。”爸爸站到他身旁，让风从背后吹来，再把风筝迎向风。黄尾巴轻轻摆动，刚才软软的翅膀鼓了起来。","爸爸松开托着风筝的手，仍在松塔旁边照看。松塔握稳线盘，轻轻收紧一点线。蓝色风筝抬起头，一点点离开草地。","“它怎么站住了？”松塔仰着脸。爸爸说：“空气流过风筝，会给它向上的力。”风筝在空中摇了摇，黄尾巴像在点头。","线盘传来轻轻的拉力，松塔忽然紧张起来：“它是不是要把线也带走？”爸爸扶住线盘：“线还连着呢，我们一起拿稳。”","松塔看看天空，又看看手中的线：“那现在怎么请它回来？”爸爸笑了：“我们把放出去的线慢慢收回来，不用猛拽。”","他们一起缓缓转动线盘。线一点点变短，风筝也慢慢靠近。爸爸向前接住它，黄尾巴落在草上，像游回岸边的小鱼。","松塔把尾巴理好，和爸爸收好线，又抱起蓝色风筝。“原来你真的会回来。”回家的路上，那条黄尾巴在他怀里轻轻晃。"];let current=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(n){current=Math.max(0,Math.min(9,n));image.src='page-'+String(current+1).padStart(2,'0')+'.png';image.alt=prose[current];counter.textContent=(current+1)+' / 10';prev.disabled=current===0;next.disabled=current===9;}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let start=0;image.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>45)show(current+(dx<0?1:-1))},{passive:true});show(0);</script></body></html>
