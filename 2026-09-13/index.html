<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>会拐弯的扫叶车</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #16130f; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #3a3023 0, #16130f 66%); }
    .reader { position: relative; width: min(1180px, calc(100vw - 28px)); height: min(820px, calc(100vh - 28px)); display: grid; place-items: center; }
    .page { display: none; width: auto; height: auto; max-width: min(1180px, calc(100vw - 28px)); max-height: min(820px, calc(100vh - 28px)); aspect-ratio: 5 / 4; object-fit: contain; border-radius: 12px; box-shadow: 0 18px 56px #0009; background: #241f18; }
    .page.active { display: block; }
    button { position: absolute; top: 50%; width: 54px; height: 82px; transform: translateY(-50%); border: 0; border-radius: 27px; color: white; background: #0008; font-size: 36px; line-height: 1; cursor: pointer; backdrop-filter: blur(8px); }
    button:active { background: #000b; }
    #prev { left: 10px; }
    #next { right: 10px; }
    .dots { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; gap: 7px; padding: 8px 12px; border-radius: 18px; background: #0007; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ffffff66; }
    .dot.active { background: white; transform: scale(1.35); }
    @media (max-width: 700px) { button { width: 44px; height: 66px; font-size: 30px; } }
  </style>
</head>
<body>
  <main class="reader" aria-label="会拐弯的扫叶车，共十页">
    <img class="page active" src="page-01.png" alt="第1页">
    <img class="page" src="page-02.png" alt="第2页" loading="eager">
    <img class="page" src="page-03.png" alt="第3页" loading="eager">
    <img class="page" src="page-04.png" alt="第4页" loading="lazy">
    <img class="page" src="page-05.png" alt="第5页" loading="lazy">
    <img class="page" src="page-06.png" alt="第6页" loading="lazy">
    <img class="page" src="page-07.png" alt="第7页" loading="lazy">
    <img class="page" src="page-08.png" alt="第8页" loading="lazy">
    <img class="page" src="page-09.png" alt="第9页" loading="lazy">
    <img class="page" src="page-10.png" alt="第10页" loading="lazy">
    <button id="prev" type="button" aria-label="上一页">‹</button>
    <button id="next" type="button" aria-label="下一页">›</button>
    <div class="dots" aria-hidden="true"></div>
  </main>
  <script>
    const pages = [...document.querySelectorAll('.page')];
    const dots = document.querySelector('.dots');
    let current = 0;
    pages.forEach((_, i) => {
      const dot = document.createElement('span');
      dot.className = `dot${i === 0 ? ' active' : ''}`;
      dots.append(dot);
    });
    const show = (next) => {
      pages[current].classList.remove('active');
      dots.children[current].classList.remove('active');
      current = (next + pages.length) % pages.length;
      pages[current].classList.add('active');
      dots.children[current].classList.add('active');
    };
    document.querySelector('#prev').addEventListener('click', () => show(current - 1));
    document.querySelector('#next').addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') show(current - 1);
      if (event.key === 'ArrowRight' || event.key === ' ') show(current + 1);
    });
    let startX = null;
    document.addEventListener('touchstart', (event) => { startX = event.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', (event) => {
      if (startX === null) return;
      const delta = event.changedTouches[0].clientX - startX;
      if (Math.abs(delta) > 45) show(current + (delta < 0 ? 1 : -1));
      startX = null;
    }, { passive: true });
  </script>
</body>
</html>
