<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小伞从哪里来</title><style>*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#f4efdc;color:#493c2d;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;width:auto;height:auto;min-height:0}nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:20px}button{width:80px;height:44px;border:0;border-radius:12px;background:#dfd4b6;color:#493c2d;font-size:18px}button:disabled{opacity:.35}#counter{min-width:65px;text-align:center}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main><script>const prose=["雨停后，小刺猬团团和爸爸山原走进树林。爸爸背着装有自然图鉴的布包。树桩旁，几朵浅褐色的小蘑菇顶着水珠，像刚撑开的小伞。","“小伞是雨水冲来的吗？”团团蹲下来，沿着湿湿的树皮看。爸爸也蹲下：“雨和蘑菇有关系，不过，光有雨水就能长出蘑菇吗？”","团团忽然摸摸自己的脑袋：“那我的头盔淋湿了，也会长吗？”爸爸想了想：“不能只看淋没淋雨。我们查查，小蘑菇究竟从哪里来。”","他们坐到路边长椅上，爸爸从布包取出图鉴。书里的朽木被画成切开的样子，里面绕着细细的线。“这些是菌丝。”爸爸指给团团看。","“有些真菌能分解朽木，从里面得到养分。你看见的小蘑菇，只是它露出来的一部分。”团团凑近书页：“原来下面还有那么多小细丝！”","图鉴里，湿润的朽木旁画着小蘑菇。爸爸说：“合适的湿度，能帮助一些蘑菇长出来。但要先有真菌，也要有适合它生长的地方。”","翻过一页，蘑菇下面画着许多很小的点。“这是放大画出的孢子。”爸爸说，“它们能随风或水去别处，遇到合适条件，才可能开始生长。”","团团合上书，又回到树桩旁。这一次，他没有扒开木头找细丝，只弯下腰看：“我看见的是小伞，藏在里面的部分，眼睛不一定看得见。”","小伞旁还有一丛绿草，叶尖也挂着水珠。“它们一起淋雨，却不是同一种东西。”爸爸说，“草是植物，蘑菇属于真菌。”团团看看草，又看看小伞。","离开时，团团回头看了一眼：“不是雨水把小伞冲来的，是这里有它能生长的条件。”爸爸牵起他的手。小伞留在树桩旁，新的问题跟着他们回了家。"];let n=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(i){n=Math.max(0,Math.min(9,i));image.src='page-'+String(n+1).padStart(2,'0')+'.png';image.alt=prose[n];counter.textContent=(n+1)+' / 10';prev.disabled=n===0;next.disabled=n===9}prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);document.onkeydown=e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)};let x=0;image.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>50)show(n+(dx<0?1:-1))},{passive:true});show(0);</script></body></html>
