<main id="reader" aria-label="一句一句搭起来，十页绘本"><img id="page" src="page-01.webp" alt="米粒想搭一座长长的车库，让蓝色小巴士晚上也有地方睡觉。爸爸抱来一筐积木，和他并排坐在地毯上。" draggable="false"></main>

<script>const prose=["米粒想搭一座长长的车库，让蓝色小巴士晚上也有地方睡觉。爸爸抱来一筐积木，和他并排坐在地毯上。", "“先摆两排方块，再把长板架上去，还要留出车门。”爸爸一口气说完。米粒抱着一块积木，手停在半空。", "那些话像一串跑得太快的车厢，米粒只记得最后的车门。他低头看看积木，又抬起头说：“爸爸，我没听懂。”", "爸爸把手里的长板放下来，靠近了一点。“刚才我说得太多了。”他说，“我们先做一件事，你把这块放在这里。”", "米粒放好第一块，推了推，让它站稳。爸爸等他抬起头，才拿出第二块。“接下来，把它放到旁边，留一点空。”", "米粒摆好两边的墙，爸爸扶着长板的一头，让他扶另一头。两双手慢慢往下放，一顶平平的屋顶搭好了。", "蓝色巴士开到门前，咚，车顶碰到了屋顶。米粒赶快把它退回来，皱着鼻子说：“它的帽子太高，进不去。”", "“我们要把哪里变高呢？”爸爸问。米粒指指两边的墙。他们先取下屋顶，再给两边各添一块一样高的积木。", "屋顶重新放好，蓝色巴士慢慢开了进去。米粒趴在门口看看，车顶上还有一点空，像藏着一小块蓝天。", "米粒把剩下的积木递给爸爸：“我还想搭个站台。你慢一点说，我一件一件做。”爸爸笑了，先在车库旁摆下一块。"];let current=0;const pic=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function show(n){current=Math.max(0,Math.min(prose.length-1,n));pic.src='page-'+String(current+1).padStart(2,'0')+'.webp';pic.alt=prose[current];count.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;if(current<prose.length-1){const preload=new Image();preload.src='page-'+String(current+2).padStart(2,'0')+'.webp'}}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});let startX=null;const reader=document.getElementById('reader');reader.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});reader.addEventListener('touchend',e=>{if(startX===null)return;const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>60)show(current+(delta<0?1:-1));startX=null},{passive:true});show(0);</script></body></html>
