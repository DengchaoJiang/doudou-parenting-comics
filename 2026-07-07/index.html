<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三格小窗里的勇气</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #17140f;
      color: #fff8ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #3a3024 0, #17140f 48%, #0d0b08 100%);
    }
    main {
      width: min(100vw, 1180px);
      padding: 14px;
    }
    .stage {
      position: relative;
      aspect-ratio: 4 / 3;
      width: 100%;
      max-height: calc(100vh - 84px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
    }
    .page {
      position: absolute;
      inset: 0;
      display: none;
    }
    .page.active {
      display: block;
    }
    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
    }
    button {
      min-width: 96px;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: #fff8ea;
      color: #2a2118;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: .45;
      cursor: default;
    }
    .count {
      color: #efe5d3;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="三格小窗里的勇气">
      <article class="page active">
        <img src="page-01.png" alt="阿栗拖着湿雨靴回到洞口，栗爸爸递来毛巾。">
      </article>
      <article class="page">
        <img src="page-02.png" alt="阿栗在温暖的家里低头说起被老师批评。">
      </article>
      <article class="page">
        <img src="page-03.png" alt="栗爸爸拿出写着三个问题的小纸窗。">
      </article>
      <article class="page">
        <img src="page-04.png" alt="阿栗在第一格画水沟和湿袜子。">
      </article>
      <article class="page">
        <img src="page-05.png" alt="阿栗画下猫头鹰老师和飘落的小叶子。">
      </article>
      <article class="page">
        <img src="page-06.png" alt="阿栗在第三格画一颗皱巴巴的心。">
      </article>
      <article class="page">
        <img src="page-07.png" alt="栗爸爸把三格小窗放到灯下，和阿栗一起商量明天。">
      </article>
      <article class="page">
        <img src="page-08.png" alt="阿栗对着布偶老师练习求助。">
      </article>
      <article class="page">
        <img src="page-09.png" alt="阿栗睡前把三格小窗和干净袜子放进小书包。">
      </article>
      <article class="page">
        <img src="page-10.png" alt="栗爸爸守在门外，阿栗在被窝里回答明天会求助。">
      </article>
    </section>
    <nav class="nav" aria-label="翻页">
      <button id="prev" type="button">上一页</button>
      <span class="count"><span id="current">1</span> / 10</span>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = Array.from(document.querySelectorAll(".page"));
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const current = document.getElementById("current");
    let index = 0;

    function render() {
      pages.forEach((page, pageIndex) => page.classList.toggle("active", pageIndex === index));
      current.textContent = String(index + 1);
      prev.disabled = index === 0;
      next.disabled = index === pages.length - 1;
    }

    prev.addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    next.addEventListener("click", () => {
      index = Math.min(pages.length - 1, index + 1);
      render();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") prev.click();
      if (event.key === "ArrowRight" || event.key === " ") next.click();
    });
    render();
  </script>
</body>
</html>
