<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小车没有不见｜2026-11-06</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#20382e;color:#fbf0d7;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}#page{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;width:auto;height:auto;min-height:0}nav{display:flex;align-items:center;justify-content:center;gap:20px;height:44px;flex-shrink:0}button{min-width:80px;height:44px;border:1px solid #9caa87;border-radius:12px;background:#3d5844;color:inherit;font-size:18px}button:disabled{opacity:.35}#counter{min-width:70px;text-align:center}</style></head><body><main><img id="page" alt=""><nav aria-label="绘本翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>const prose=["小水獭圆圆把木头垃圾车开过地毯上的小桥。咕噜噜，小车钻到扶手椅下面。圆圆趴下来找：“咦，我的红色小车不见了！”","椅子下面暗暗的。圆圆把眼睛睁得大大的，只看见一团模糊的影子。他小声问爸爸岸山：“我明明看着它开进去，怎么找不到呀？”","岸山在地毯上蹲下来：“这里的光太少了。先别往里面钻，爸爸拿个手电筒来。”圆圆坐在旁边，紧紧盯住那个黑乎乎的小车库。","爸爸从抽屉里取出手电筒，把光照在椅子前的地毯上。亮亮的一小片，好像一块会走路的饼干。圆圆忍不住笑了：“它还会搬家！”","岸山把光移到椅垫上，没有小车；又慢慢往下移。圆圆伸出小手指：“再低一点！我记得它从那条缝里开进去的。”","光钻进椅子下面，一只红车轮亮了起来。圆圆一下坐直了：“在那里！车头也在！”爸爸没有移动椅子，小车却像从影子里冒了出来。","“灯移开，它还看得清吗？”圆圆问。爸爸把光转回地毯，小车又难看清了；光再移回去，红车轮又露了出来。圆圆高兴地拍了拍腿。","岸山伸手把小车取出来，放在亮处。圆圆抱住它，又看看手电筒：“是灯看见它，再告诉我的眼睛吗？”爸爸笑着摇摇头。","“灯光照到小车上，有些光来到你的眼睛里，眼睛再把消息送给大脑。”岸山说。圆圆摸摸脑袋：“原来它们在一起帮我找车！”","圆圆把小车停进地毯边亮亮的纸盒车库，还给它留了一个大门。“这回我找得到你啦！”他靠着爸爸笑了。小车没有不见，只是刚才躲在光少的地方。"];let current=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){image.src='page-'+String(current+1).padStart(2,'0')+'.png';image.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}function turn(step){current=Math.max(0,Math.min(prose.length-1,current+step));show()}prev.onclick=()=>turn(-1);next.onclick=()=>turn(1);addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let startX=0;image.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)turn(dx<0?1:-1)},{passive:true});show();</script></body></html>
