<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>这时候，可以快快跑｜2026-08-04 追加绘本</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f3eadb; color: #263238; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(8vh + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      overscroll-behavior: none;
    }
    main { width: min(94vw, 1120px); display: grid; gap: 10px; }
    .book {
      position: relative;
      aspect-ratio: 5 / 4;
      overflow: hidden;
      border-radius: 18px;
      background: #fff9ef;
      box-shadow: 0 12px 36px rgb(76 57 35 / 20%);
      touch-action: pan-y;
    }
    .page { display: none; width: 100%; height: 100%; }
    .page.active { display: block; }
    .page img { width: 100%; height: 100%; display: block; object-fit: contain; }
    nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: #345f68;
      color: white;
      font: inherit;
      font-weight: 700;
      padding: 8px 18px;
      cursor: pointer;
    }
    button:last-child { justify-self: end; }
    button:disabled { opacity: .36; cursor: default; }
    output { min-width: 4.5em; text-align: center; font-variant-numeric: tabular-nums; }
    @media (max-height: 620px) {
      body { padding-bottom: calc(10vh + env(safe-area-inset-bottom)); }
      main { width: min(88vw, 960px); }
    }
  </style>
</head>
<body>
  <main aria-label="绘本《这时候，可以快快跑》">
    <section class="book" id="book">
      <div class="page active"><img src="page-01.png" alt="《这时候，可以快快跑》第1页"></div>
      <div class="page"><img src="page-02.png" alt="《这时候，可以快快跑》第2页"></div>
      <div class="page"><img src="page-03.png" alt="《这时候，可以快快跑》第3页"></div>
      <div class="page"><img src="page-04.png" alt="《这时候，可以快快跑》第4页"></div>
      <div class="page"><img src="page-05.png" alt="《这时候，可以快快跑》第5页"></div>
      <div class="page"><img src="page-06.png" alt="《这时候，可以快快跑》第6页"></div>
      <div class="page"><img src="page-07.png" alt="《这时候，可以快快跑》第7页"></div>
      <div class="page"><img src="page-08.png" alt="《这时候，可以快快跑》第8页"></div>
      <div class="page"><img src="page-09.png" alt="《这时候，可以快快跑》第9页"></div>
      <div class="page"><img src="page-10.png" alt="《这时候，可以快快跑》第10页"></div>
    </section>
    <nav aria-label="翻页控制">
      <button id="prev" type="button">上一页</button>
      <output id="counter" aria-live="polite">1 / 10</output>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = [...document.querySelectorAll('.page')];
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');
    const counter = document.querySelector('#counter');
    const book = document.querySelector('#book');
    let current = 0;
    let startX = 0;

    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      pages.forEach((page, i) => page.classList.toggle('active', i === current));
      counter.value = `${current + 1} / ${pages.length}`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }

    prev.addEventListener('click', () => show(current - 1));
    next.addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') show(current - 1);
      if (event.key === 'ArrowRight') show(current + 1);
    });
    book.addEventListener('touchstart', (event) => { startX = event.changedTouches[0].clientX; }, { passive: true });
    book.addEventListener('touchend', (event) => {
      const delta = event.changedTouches[0].clientX - startX;
      if (Math.abs(delta) > 45) show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
    show(0);
  </script>
</body>
</html>
