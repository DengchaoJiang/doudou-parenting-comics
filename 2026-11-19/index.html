<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>电车头顶的小手</title><style>*{box-sizing:border-box}body{margin:0;background:#253b42;color:#fff;font:18px system-ui}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 8px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-width:100%;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 60px)}nav{display:flex;align-items:center;gap:14px;height:44px;flex-shrink:0}button{border:0;border-radius:8px;min-height:44px;padding:0 12px;background:#f8dfa9;color:#253b42;font:inherit}button:disabled{opacity:.5}a{color:#f8dfa9}</style><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="绘本翻页"><a href="../">首页</a><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>const images=["page-01.png","page-02.png","page-03.png","page-04.png","page-05.png","page-06.png","page-07.png","page-08.png","page-09.png","page-10.png"],story=["雨刚停，小獾松芽跟爸爸砚青去坐电车。水洼映出一条细细的黑线。松芽抬头看，线原来挂在轨道上方。","电车从街角拐过来，车顶也有个伸向天空的架子。松芽看见它在动，连忙问：“它是不是在帮电车扶帽子？”","他们站在站台的安全线后面。电车停稳后，松芽终于看清了：架子顶端横着一小条，正贴着那根细线。","“那是受电弓。”砚青顺着松芽手指的方向看过去，“这辆车用它从头顶的线取电。你看，它还贴着呢。”","车门开了，松芽坐到窗边。铃声一响，电车慢慢起步。他看见一根又一根撑线的杆子从窗边滑过去。","到了转弯的地方，窗外的线被屋檐挡住了。松芽探了探头：“线是不是断了？可是车还在走呀。”","砚青指了指前面开阔的路口：“等到了那里，我们再看。”松芽坐好，眼睛一直跟着远处的撑线杆。","下车后，父子俩站到广场边。电车拐过弯，松芽终于看清，细线连在一起，车顶那一小条沿着线滑过去。","回到家，松芽翻开自己的画。昨天画的电车光着头，他添上一根长线，又给小车画了个碰得到线的架子。","松芽把画举到爸爸眼前。画里的电车也拐过一个弯，这回线一直跟到下一根杆子。“找到了！”他笑着说。"];const page=document.querySelector("#page"),prev=document.querySelector("#prev"),next=document.querySelector("#next"),counter=document.querySelector("#counter");let i=0,start;function show(n){i=Math.min(images.length-1,Math.max(0,n));page.src=images[i];page.alt=story[i];counter.textContent=(i+1)+" / "+images.length;prev.disabled=i===0;next.disabled=i===images.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1)});page.addEventListener("touchstart",e=>start=e.changedTouches[0].clientX,{passive:true});page.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});show(0)</script></body></html>
