*{box-sizing:border-box}html,body{margin:0;background:#f4ead3;color:#263b32;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0;height:44px}button{height:44px;min-width:80px;padding:0 14px;border:0;border-radius:9px;background:#355b4c;color:white;font-size:17px;cursor:pointer}button:disabled{opacity:.35}#counter{min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>
const prose=["葡萄车拐了一个弯。小刺猬星米给自己的蓝车起了个名字，叫“葡萄车”。清早，他推着车找爸爸砚山：“今天，我要装满整整两筐果子！”", "他们来到果园。一串串葡萄藏在叶子下面，像绿珠子和红珠子。星米踮起脚，车斗空空地等着，连小轮子都不响了。", "爸爸剪下葡萄，星米扶稳篮子。葡萄落进去，轻轻一颤。他看看空着的另一个篮子：“还要装苹果！我去找苹果藤！”", "星米沿着架子找，一片叶子、一片叶子地看。这里只有葡萄，没有苹果。他把车推回来，耳朵垂下去：“苹果都躲起来了吗？”", "爸爸没有往车里放果子，而是蹲下来，指着一根细细的卷须。卷须绕着架子，像一只弯弯的小手，把葡萄藤拉住了。", "“葡萄藤会攀着东西长，这里给它搭了架子。”爸爸说。星米顺着藤看上去，又看看前方：“那苹果，也有这样的小手吗？”", "爸爸带他拐了个弯。一棵苹果树站在路边，树干分出枝条，苹果就挂在枝上。星米抬起头：“原来，你们住在这里！”", "星米来回看了两遍：一边是绕着架子的葡萄藤，一边是伸出枝条的苹果树。想装到苹果，车就得换一条路，不能只在葡萄架下找。", "他把蓝车推到树旁。爸爸摘下低枝上的苹果，星米站在地上，扶着篮子接住。圆圆的苹果一放进去，第二个篮子也有了颜色。", "回去的路上，车轮碰到小石子，咯噔一下。星米连忙扶好两只篮子：“慢一点，葡萄和苹果都坐稳啦！”爸爸陪他绕过石子。", "到了家，星米又摸摸蓝车：“你还叫葡萄车，可是今天也运过苹果。”爸爸笑了。两只篮子并排放着，记住了他们一起拐过的那个弯。"];let n=0;const page=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){page.src='page-'+String(n+1).padStart(2,'0')+'.png';page.alt=prose[n];counter.textContent=(n+1)+' / '+prose.length;prev.disabled=n===0;next.disabled=n===prose.length-1}function move(d){n=Math.max(0,Math.min(prose.length-1,n+d));show()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let start;page.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});page.addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)move(delta<0?1:-1)},{passive:true});show();
</script></body></html>
