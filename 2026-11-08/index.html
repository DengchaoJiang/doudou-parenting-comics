<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小路为什么陷下去｜2026-11-08</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f0e5;color:#493321;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{height:44px;display:flex;align-items:center;gap:24px;flex-shrink:0}button{height:44px;min-width:88px;border:1px solid #c7b296;border-radius:9px;background:#fffaf3;color:#493321;font:inherit}button:disabled{opacity:.35}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>const prose=["小河狸木笛在游戏室的沙盘里铺了一条湿沙路。他把木头巴士装满小积木，要把这车货送到新盖的车站。","巴士才走几步，轮子就陷了下去。木笛使劲往前推，车身一歪，小积木咕噜噜滚进沙里。“我的车站还等着呢！”","木笛又舀来一勺沙，盖住深深的车辙。巴士再开，松松的沙又往旁边挤。他皱着鼻子问：“路怎么越修越难走呀？”","爸爸岸舟坐到沙盘旁，拿来一只光滑的小滚筒。木笛想起见过的压路机：“它前面的大轮子，也是这样的吗？”","“那叫滚筒，压路机用它来压实路面。”爸爸先在旁边轻轻滚一下，又按稳滚筒慢慢推过。鼓起的小沙包矮下去了一点。","爸爸说：“压一压，松散的沙粒挤得更紧些，这段路就更结实了。”木笛把巴士轻放上去，发现轮子留下的印子浅多了。","“可以送货啦！”木笛刚要出发，又停住了。前面还有一段没压过的沙，他用小铲子指给爸爸看：“那里还是松松的！”","爸爸扶稳沙盘，木笛握住小滚筒，慢慢把剩下那段压好。他没有急着推车，先把掉在沙里的积木一块块找回来。","巴士重新装满，沿着压过的小路往前走。这次车轮没有深深陷下去，木笛跟在旁边，小声报站：“积木车站，到啦！”","积木送进车站，木笛把巴士停在门边，又给小滚筒留了一个位置。他轻轻拍拍它：“这趟货，算你也送了一半。”爸爸笑着点了点头。"];let current=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(n){current=Math.max(0,Math.min(9,n));image.src='page-'+String(current+1).padStart(2,'0')+'.png';image.alt=prose[current];counter.textContent=(current+1)+' / 10';prev.disabled=current===0;next.disabled=current===9;}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let start=0;image.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>45)show(current+(dx<0?1:-1))},{passive:true});show(0);</script></body></html>
