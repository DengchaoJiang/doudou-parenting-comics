<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302b26">
  <title>2026-08-25 科普绘本《横木头睡成一条路》</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background: #302b26; color: #f6e5bd; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 25%, #705239 0, #302b26 78%); }
    .reader { position: fixed; inset: 0; min-height: 0; }
    .topbar { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 2; font-size: clamp(13px, 1.8vw, 18px); }
    .home { color: inherit; text-decoration: none; padding: 8px 10px; }
    .counter { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
    .stage { position: absolute; top: calc(max(10px, env(safe-area-inset-top)) + 48px); left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); bottom: calc(82px + 8vh + env(safe-area-inset-bottom)); display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }
    .stage img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; box-shadow: 0 12px 36px rgba(0, 0, 0, .4); user-select: none; -webkit-user-drag: none; }
    .controls { position: absolute; left: max(18px, env(safe-area-inset-left)); right: max(18px, env(safe-area-inset-right)); bottom: calc(2vh + env(safe-area-inset-bottom)); height: 64px; display: flex; justify-content: center; gap: clamp(18px, 8vw, 88px); z-index: 2; }
    button { min-width: clamp(120px, 22vw, 220px); min-height: 56px; border: 1px solid rgba(255, 255, 255, .22); border-radius: 999px; background: rgba(48, 43, 38, .96); color: #fff3d6; font: inherit; font-size: clamp(18px, 2.3vw, 24px); cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: .35; }
    button:active:not(:disabled) { transform: scale(.98); }
    @media (max-height: 540px) { .topbar { font-size: 13px; } .stage { top: 42px; bottom: calc(66px + 8vh + env(safe-area-inset-bottom)); } .controls { height: 52px; } button { min-height: 48px; } }
  </style>
</head>
<body>
  <main class="reader" aria-label="绘本阅读器">
    <header class="topbar">
      <a class="home" href="../" aria-label="返回绘本目录">‹ 绘本目录</a>
      <span class="counter" id="counter" aria-live="polite">第 1 / 10 页</span>
    </header>
    <section class="stage" id="stage">
      <img id="page" src="page-01.png" alt="傍晚，砾砾摆出十二根木条，开了一家小铺。十块钱一捆！我要铺一条长长的火车路。">
    </section>
    <nav class="controls" aria-label="翻页">
      <button id="prev" type="button" disabled>上一页</button>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = [
      ["page-01.png", "傍晚，砾砾摆出十二根木条，开了一家小铺。十块钱一捆！我要铺一条长长的火车路。"],
      ["page-02.png", "他把木条全都朝前接起来。小火车刚开上去，歪路一扭，车轮咔哒掉进了地毯谷。"],
      ["page-03.png", "杉爸爸说：等我收好盘子，就来帮第一小段。砾砾守着歪路，先找最会摇晃的地方。"],
      ["page-04.png", "杉爸爸把两根长轨并排放好，又让短木横着睡在下面。砾砾一试，这一小段不晃了。"],
      ["page-05.png", "可两条长轨一会儿挤近，一会儿跑远，火车卡住了。砾砾盯着车轮：让火车自己量宽窄！"],
      ["page-06.png", "砾砾边推火车，边调整长轨。车轮顺滑的地方，他就压下一根横木；杉爸爸只扶住第一根。"],
      ["page-07.png", "铺到第十二根时，火车又咯噔一下。砾砾发现中间空得太大：这里少了一个肩膀。"],
      ["page-08.png", "他搬来最后一根短木，横着补进空处。两条长轨不挤也不散，横木稳稳睡在下面。"],
      ["page-09.png", "空车慢慢跑一遍，装上木块再跑一遍。轻车通过了，重车也通过了：咔哒、咔哒！"],
      ["page-10.png", "睡前，砾砾把火车停回小铺旁。黑暗里传来轻轻的咔哒声——十二根横木正做着火车梦。"]
    ];
    let current = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current][0];
      image.alt = pages[current][1];
      counter.textContent = `第 ${current + 1} / ${pages.length} 页`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }
    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => { if (event.key === "ArrowLeft") show(current - 1); if (event.key === "ArrowRight") show(current + 1); });
    let touchStartX = 0;
    document.getElementById("stage").addEventListener("touchstart", (event) => { touchStartX = event.changedTouches[0].clientX; }, { passive: true });
    document.getElementById("stage").addEventListener("touchend", (event) => { const delta = event.changedTouches[0].clientX - touchStartX; if (Math.abs(delta) < 45) return; show(current + (delta < 0 ? 1 : -1)); }, { passive: true });
  </script>
</body>
</html>
