<script>const prose=["雨停了，小水獭小沐和爸爸走过石头路。路边的小水沟哗啦啦地响，他踮起脚问：“河里的水，也会慢慢长大吗？”","爸爸没有急着回答。他们停在离水沟远远的干路上，只见一条细细的水线绕过石头，钻进了另一条更宽的水路。","“它们碰到一起啦！”小沐沿着干路往前看。屋顶滴下来的雨水顺着水管落地，也加入了那支亮晶晶的小队伍。","水沟伸向低处，最后通到小河。爸爸指给他看：“下雨以后，有些水沿着地面往低处流，小水路就这样汇进了河里。”","小沐想走近一点，爸爸牵住他的手：“我们就在护栏后面看。”他靠着爸爸，望见水面上的涟漪一圈圈地散开。","“没下雨的时候，河水从哪儿来？”小沐问。爸爸说：“有些地方有融化的雪水，还有些水从地下慢慢流进河里。”","回家后，小沐还惦记着那些小水路。爸爸拿来浅托盘和两条矮水槽，把水槽的一头垫高，低的一头都对着托盘。","小沐猜水会停在高处。爸爸扶好水槽，他慢慢倒下一点水。水却顺着斜坡溜下去，在托盘里摊成一小片亮光。","他们又往另一条水槽倒水，两股细流在托盘里碰头了。小沐笑出声：“原来不是水长高了，是又有水跑来啦！”","爸爸陪他倒空托盘，擦干桌子。窗边还挂着几滴雨水，小沐轻轻说：“你们往低处走吧，也许能找到自己的小河。”"];let current=0;const pic=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function show(n){current=Math.max(0,Math.min(prose.length-1,n));pic.src='page-'+String(current+1).padStart(2,'0')+'.webp';pic.alt=prose[current];count.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;if(current<prose.length-1){const preload=new Image();preload.src='page-'+String(current+2).padStart(2,'0')+'.webp'}}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});let startX=null;const reader=document.getElementById('reader');reader.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});reader.addEventListener('touchend',e=>{if(startX===null)return;const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>60)show(current+(delta<0?1:-1));startX=null},{passive:true});show(0);</script></body></html>
