<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#243d46">
  <title>2026-08-19 科普绘本《五艘周末船》</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #243d46;
      color: #fff0cc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 28%, #a86e3b 0, #243d46 76%); }
    .reader { position: fixed; inset: 0; min-height: 0; }
    .topbar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 2;
      color: #fff0cc;
      font-size: clamp(13px, 1.8vw, 18px);
    }
    .home { color: inherit; text-decoration: none; padding: 8px 10px; }
    .counter { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
    .stage {
      position: absolute;
      top: calc(max(10px, env(safe-area-inset-top)) + 48px);
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(82px + 8vh + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .38);
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(2vh + env(safe-area-inset-bottom));
      height: 64px;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 8vw, 88px);
      z-index: 2;
    }
    button {
      min-width: clamp(120px, 22vw, 220px);
      min-height: 56px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(36, 61, 70, .96);
      color: #fff8e5;
      font: inherit;
      font-size: clamp(18px, 2.3vw, 24px);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .35; }
    button:active:not(:disabled) { transform: scale(.98); }
    @media (max-height: 540px) {
      .topbar { font-size: 13px; }
      .stage { top: 42px; bottom: calc(66px + 8vh + env(safe-area-inset-bottom)); }
      .controls { height: 52px; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="reader" aria-label="绘本阅读器">
    <header class="topbar">
      <a class="home" href="../" aria-label="返回绘本目录">‹ 绘本目录</a>
      <span class="counter" id="counter" aria-live="polite">第 1 / 10 页</span>
    </header>
    <section class="stage" id="stage">
      <img id="page" src="page-01.png" alt="海风镇的晚霞像一大勺橘子酱。满满问松爷爷还要多久才来，榆爸爸说还要五个周末。">
    </section>
    <nav class="controls" aria-label="翻页">
      <button id="prev" type="button" disabled>上一页</button>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = [
      ["page-01.png", "海风镇的晚霞像一大勺橘子酱。满满问松爷爷还要多久才来，榆爸爸说还要五个周末。"],
      ["page-02.png", "满满把玩具钓竿朝天空一甩，想把周末钓下来；软云里却掉出一张蓝纸。"],
      ["page-03.png", "父子折出五艘小船，画上一到五颗圆点，把它们停在还在等的纸海边。"],
      ["page-04.png", "第一个周末，满满把一颗圆点的小船送进已经过的海里。"],
      ["page-05.png", "第二个周末，两颗圆点的小船也开过去，等待的海还剩三艘。"],
      ["page-06.png", "第三个周末，满满问为什么不能一口气全开过去，榆爸爸请他给今天的船装进一个真的周末。"],
      ["page-07.png", "满满把小面包香、圆石头和笑声装进三颗圆点的船，发现等待里面也有今天。"],
      ["page-08.png", "第四个周末，父子玩空中钓鱼，银色风鱼和旧袜子逗得他们大笑。"],
      ["page-09.png", "最后一个周末，满满和榆爸爸一起把最后一艘船稳稳送过纸浪。"],
      ["page-10.png", "松爷爷站在晚霞里，满满指着五艘船说，每个周末都真的来过。"]
    ];
    let current = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current][0];
      image.alt = pages[current][1];
      counter.textContent = `第 ${current + 1} / ${pages.length} 页`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }
    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
    });
    let touchStartX = 0;
    document.getElementById("stage").addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.getElementById("stage").addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
  </script>
</body>
</html>
