<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3f4f46">
  <title>2026-08-14 科普绘本《追不到的彩虹门》</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #3f4f46;
      color: #fff2cc;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 28%, #a67645 0, #3f4f46 76%); }
    .reader { position: fixed; inset: 0; min-height: 0; }
    .topbar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 2;
      color: #fff2cc;
      font-size: clamp(13px, 1.8vw, 18px);
    }
    .home { color: inherit; text-decoration: none; padding: 8px 10px; }
    .counter { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
    .stage {
      position: absolute;
      top: calc(max(10px, env(safe-area-inset-top)) + 48px);
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(82px + 8vh + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .38);
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(2vh + env(safe-area-inset-bottom));
      height: 64px;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 8vw, 88px);
      z-index: 2;
    }
    button {
      min-width: clamp(120px, 22vw, 220px);
      min-height: 56px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(63, 79, 70, .96);
      color: #fff8e5;
      font: inherit;
      font-size: clamp(18px, 2.3vw, 24px);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .35; }
    button:active:not(:disabled) { transform: scale(.98); }
    @media (max-height: 540px) {
      .topbar { font-size: 13px; }
      .stage { top: 42px; bottom: calc(66px + 8vh + env(safe-area-inset-bottom)); }
      .controls { height: 52px; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="reader" aria-label="绘本阅读器">
    <header class="topbar">
      <a class="home" href="../" aria-label="返回绘本目录">‹ 绘本目录</a>
      <span class="counter" id="counter" aria-live="polite">第 1 / 10 页</span>
    </header>
    <section class="stage" id="stage">
      <img id="page" src="page-01.png" alt="傍晚，急雨刚刚跑远。小水獭澄澄忽然看见，河湾上架起一扇七彩的弯门。">
    </section>
    <nav class="controls" aria-label="翻页">
      <button id="prev" type="button" disabled>上一页</button>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = [
      ["page-01.png", "傍晚，急雨刚刚跑远。小水獭澄澄忽然看见，河湾上架起一扇七彩的弯门。"],
      ["page-02.png", "泉爸爸，彩虹从哪儿长出来的？澄澄追到柳树旁，又跑到小桥边，可彩虹一点也没有变近。"],
      ["page-03.png", "泉爸爸轻轻搭住他的肩：它不是能跑到门口的桥。我们先看看，谁在帮忙。"],
      ["page-04.png", "云缝里露出太阳，草尖还挂着水滴。一束阳光钻进圆水滴，在门口弯了一下。"],
      ["page-05.png", "光在水滴里转过身，出来时，挤在一起的颜色排成了长长一队。"],
      ["page-06.png", "无数水滴把光送回澄澄眼里。红光站得高一些，紫光站得低一些，排成彩色弧线。"],
      ["page-07.png", "太阳在我背后，彩虹在我前面！澄澄一转身，彩虹不见了；再转回来，它又亮了。"],
      ["page-08.png", "回到院子，泉爸爸喷出细细水雾。澄澄背对太阳，蹲一蹲、挪一挪，一小截彩虹出现了。"],
      ["page-09.png", "风吹散水雾，小彩虹也消失了。澄澄笑着说：太阳、水滴和我，要刚好站成一队。"],
      ["page-10.png", "彩虹不是等我追到的门，是光和水滴送来的礼物。父子俩沿着湿亮亮的小路回家。"]
    ];
    let current = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current][0];
      image.alt = pages[current][1];
      counter.textContent = `第 ${current + 1} / ${pages.length} 页`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }
    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
    });
    let touchStartX = 0;
    document.getElementById("stage").addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.getElementById("stage").addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
  </script>
</body>
</html>
