<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>一条看不见的小路</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#26302b;color:#fff;font-family:system-ui}main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 42px;gap:6px;padding:8px 10px calc(8vh + env(safe-area-inset-bottom));}#page{width:100%;height:100%;object-fit:contain;min-height:0;display:block}nav{display:flex;gap:18px;justify-content:center;align-items:center}button{border:0;border-radius:9px;padding:9px 22px;min-height:40px;background:#e6e8d8;color:#152a28;font-size:16px}button:disabled{opacity:.4}#counter{min-width:70px;text-align:center}</style></head>
<body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main><script>
const prose=["《一条看不见的小路》 小水獭麦麦把蓝纸铺成一条河，折好的小纸鱼排着队，准备回家。河岸旁有一盏旧台灯，它想借一点光。一尾小鱼从爪边滑落，钻进灯座的缝里。","“我的小鱼！”麦麦蹲下来，想往缝里伸爪。河川爸爸立刻挡住它，又收走旁边的小木棒：“这里是电器，爪子和小棒都不能伸进去，我们先退开。”","麦麦站到爸爸身边，尾巴垂下来：“可是它还在里面。”爸爸蹲下说：“我知道你舍不得。我会请懂得修灯的大人处理，不让你在这里冒险。”","爸爸把蓝纸河和剩下的小鱼拿到外面的桌上，锁好通往旧灯的门。河还是暗暗的，麦麦盯着空出来的位置，小声说：“少了一条鱼，它们也找不到回家的路了。”","“我们先照亮河，再想小鱼的事。”爸爸拿来一只小手电，检查好外壳和锁好的电池仓，把它放在桌上。麦麦歪着头看：“这只怎么也没有光？”","爸爸指给它看外面的开关。麦麦按了一下，暖暖的光落在蓝纸上；再按一下，光又没了。它吃惊地翻开爪心：“我没有把光拿出来呀！”","爸爸笑了：“这盏电池灯亮起来，需要里面的小路接通。开关能把路接通，也能把它断开。”麦麦又按了一次，蓝纸河重新亮了。","麦麦把手电放稳，让光照着纸河，不照爸爸的眼睛。“这一次，原来是开关没打开。”爸爸点头：“对。但别的灯不亮，原因可不一定一样。”","爸爸递来一张蓝纸，陪麦麦画了一条大尾巴鱼。麦麦把新鱼放进河里，又给那条还没取出来的小鱼留了一个位置：“等爸爸找人处理好了，再接你回来。”","屋子安静下来，麦麦关好手电，靠着爸爸看纸河。小鱼们的家还在，留出的位置也还在。它摸摸外面的开关，轻声说：“不伸进灯里，我们也找到光了。”"];let current=0;const picture=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');
function show(){picture.src='page-'+String(current+1).padStart(2,'0')+'.png';picture.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;}
function move(delta){current=Math.max(0,Math.min(prose.length-1,current+delta));show();}
prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);};let start;picture.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});picture.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)move(delta<0?1:-1);},{passive:true});show();
</script></body></html>
