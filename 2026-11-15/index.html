<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小水路慢慢不见了</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#eee5d3;color:#3b4038;font:16px system-ui,sans-serif}body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;height:50px;flex:none}header a{color:inherit;text-decoration:none}h1{font-size:17px;margin:0}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 12px calc(8vh + env(safe-area-inset-bottom));position:relative;touch-action:pan-y}#page{display:block;width:100%;height:100%;object-fit:contain;user-select:none}nav{position:fixed;bottom:env(safe-area-inset-bottom);height:8vh;min-height:44px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:24px;background:#eee5d3}button{border:1px solid #97a69e;border-radius:24px;background:#fff9ed;color:#34473f;font:inherit;min-width:90px;min-height:42px;padding:8px 20px;cursor:pointer}button:disabled{opacity:.35;cursor:default}#count{min-width:55px;text-align:center;font-variant-numeric:tabular-nums}@media(max-height:540px){header{height:40px;padding:5px 16px}h1{font-size:15px}}
</style></head><body><header><a href="../">← 全部绘本</a><h1>小水路慢慢不见了</h1><span>2026-11-15</span></header><main id="stage"><img id="page" src="page-01.webp" alt="小獾小拓刚洗好红色玩具货车，轮子就在深色托盘上留下一条亮亮的小水路，好像拖着一根细尾巴。" draggable="false"></main><nav aria-label="翻页"><button id="prev" disabled aria-label="上一页">上一页</button><span id="count" role="status" aria-live="polite">1 / 10</span><button id="next" aria-label="下一页">下一页</button></nav>
<script>
const prose=["小獾小拓刚洗好红色玩具货车，轮子就在深色托盘上留下一条亮亮的小水路，好像拖着一根细尾巴。","小拓在旁边搭起积木车站。等他抬起头，小水路短了一截。他赶紧叫爸爸：“小车把水喝掉了吗？”","爸爸把红车停到干毛巾上，托盘留在原处。小拓看了又看，没有小车来喝，水路还是慢慢变浅。","小拓摸摸托盘底下，手指干干的，也没有漏水。爸爸拿来湿布，在水路旁边轻轻擦出一个小圆圈。","小拓盯得眼睛都累了，圆圈还在那里。“水变干需要时间。”爸爸说，“我们先把车站搭好吧。”","午后，小拓给车站添了屋顶，又开红车运了几趟积木。傍晚回来看，圆圈和小水路都已经干了。","“没人喝，也没有漏，水去哪儿啦？”小拓托着下巴。爸爸说：“它慢慢变成水蒸气，到空气里去了。”","“原来不烧开也可以！”小拓伸手摸摸空气，什么也没抓到。爸爸笑了：“水蒸气本来就看不见呀。”","小拓给车站留了一个宽宽的停车位，红车稳稳开进去。他还记着小水路：“下次洗车，我们再看看！”","爸爸把湿毛巾挂好，陪小拓关上车库门。小拓轻轻挥挥手：“晚安，小红车。小水路已经到空气里去啦。”"];
let p=0;const img=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),stage=document.getElementById('stage');
function show(n){p=Math.max(0,Math.min(9,n));img.src='page-'+String(p+1).padStart(2,'0')+'.webp';img.alt=prose[p];prev.disabled=p===0;next.disabled=p===9;count.textContent=(p+1)+' / 10';if(p<9){const pre=new Image();pre.src='page-'+String(p+2).padStart(2,'0')+'.webp'}}
prev.onclick=()=>show(p-1);next.onclick=()=>show(p+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(p+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(p-1)}});
let sx=0,sy=0;stage.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))show(p+(dx<0?1:-1))},{passive:true});
</script></body></html>
