<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小山变成了小花</title>
<style>*{box-sizing:border-box}body{margin:0;background:#302c27;color:#fff;font-family:system-ui}main{height:100dvh;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}#page{display:block;width:100%;height:calc(100% - 52px);min-height:0;object-fit:contain}nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:24px}button{min-width:78px;height:44px;border:0;border-radius:12px;font-size:17px;background:#f1d7ad}button:disabled{opacity:.35}</style>
<main><img id="page" alt=""><nav><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main>
<script>const prose=["《小山变成了小花》\n小獾冬冬的肚子咕噜叫了。山岳爸爸把南瓜泥盛成一座圆圆的小山，热气轻轻往上飘。冬冬举起小勺：“我要从山顶开始吃！”","“先等一等，还烫着呢。”爸爸把盘子放在冬冬够不到的地方。冬冬的小勺停在半空：“可是，我的肚子已经等好久了。”","爸爸给他一小片已经凉好的面包，自己坐在旁边。冬冬咬了一口，又盯着南瓜小山：“热气都快看不见了，是不是能吃了？”","爸爸用食物温度计检查了南瓜泥，轻轻摇头：“里面还热着，不能只看有没有热气。”冬冬垂下小勺：“小山里面，是不是藏着好多热？”","“我们给里面也开几扇窗吧。”爸爸拿起大勺，把南瓜泥分开，摊成薄薄的小份。冬冬看着圆圆的山顶慢慢消失，忽然有点舍不得。","“我的小山没有了。”他小声说。爸爸停下勺子：“你喜欢它高高的样子呀。”冬冬点头，过了一会儿，又望着摊开的南瓜泥：“也有一点像花瓣。”","爸爸顺着那些小份，把南瓜泥排成一朵小花。“小份摊薄，比挤成大团容易凉。”冬冬弯起嘴角：“那我的小勺就是来看花的小蜜蜂。”","爸爸把大盘继续放在远处，冬冬让小勺在自己的空碗边嗡嗡绕圈。等了一会儿，爸爸重新检查南瓜泥不同的地方，确认已经凉到适合吃，才分一点给他。","冬冬安稳坐好，舀起一小勺，慢慢吃下去。“甜甜的，不烫啦！”他又舀了一点。这次小蜜蜂没有急着扑上去，而是在碗边轻轻停了停。","盘子里的小花渐渐变小，冬冬的肚子不再咕噜叫。他靠近爸爸：“今天，小山变成花了。”爸爸笑着说：“嗯，花也等到了来看它的小蜜蜂。”"];let current=1;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next');function show(){image.src='page-'+String(current).padStart(2,'0')+'.png';image.alt=prose[current-1];document.querySelector('#counter').textContent=current+' / 10';prev.disabled=current===1;next.disabled=current===10}prev.onclick=()=>{if(current>1){current--;show()}};next.onclick=()=>{if(current<10){current++;show()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});show();</script></html>
