<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>乌云没有偷走白色</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #172536; color: #fff; font-family: system-ui, "Microsoft YaHei", sans-serif; }
    main { min-height: 0; display: grid; place-items: center; overflow: hidden; padding: 14px; }
    img { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 36px #0009; }
    nav { min-height: calc(8vh + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(110px, 1fr) auto minmax(110px, 1fr); gap: 14px; align-items: center; padding: 10px 18px calc(10px + env(safe-area-inset-bottom)); background: #172536; }
    button { min-height: 52px; border: 1px solid #fff3; border-radius: 14px; background: #f0c86f; color: #172536; font: inherit; font-weight: 700; font-size: 18px; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }
    #prev, #next { justify-self: stretch; }
    #counter { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main><img id="page" src="page-01.png" alt="第1页：小水獭阿沐和爸爸在河边看见乌云。"></main>
  <nav aria-label="绘本翻页">
    <button id="prev" type="button" disabled>上一页</button>
    <span id="counter" aria-live="polite">1 / 10</span>
    <button id="next" type="button">下一页</button>
  </nav>
  <script>
    const pages = [
      "page-01.png", "page-02.png", "page-03.png", "page-04.png", "page-05.png",
      "page-06.png", "page-07.png", "page-08.png", "page-09.png", "page-10.png"
    ];
    const alts = [
      "小水獭阿沐和爸爸在河边看见乌云。",
      "阿沐追着云影，爸爸邀请他先猜再验证。",
      "阿沐猜想乌云里装满了雨。",
      "父子用灯和白纸比较光线强弱。",
      "阿沐发现叠得越厚，穿过的光越少。",
      "父子观察被阳光照亮的云边和深灰云底。",
      "乌云被风推远，没有马上下雨。",
      "远处厚云下起细雨，近处河岸仍然干燥。",
      "阿沐把关于云和光的新发现画进小本子。",
      "傍晚父子牵手回家，决定继续观察并修正答案。"
    ];
    let index = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(nextIndex) {
      index = Math.max(0, Math.min(9, nextIndex));
      image.src = pages[index];
      image.alt = `第${index + 1}页：${alts[index]}`;
      counter.textContent = `${index + 1} / 10`;
      prev.disabled = index === 0;
      next.disabled = index === 9;
    }
    prev.addEventListener("click", () => show(index - 1));
    next.addEventListener("click", () => show(index + 1));
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") show(index - 1);
      if (event.key === "ArrowRight") show(index + 1);
    });
    let touchX = null;
    document.addEventListener("touchstart", event => { touchX = event.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", event => {
      if (touchX === null) return;
      const delta = event.changedTouches[0].clientX - touchX;
      if (Math.abs(delta) > 45) show(index + (delta < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });
  </script>
</body>
</html>
