*{box-sizing:border-box}html,body{margin:0;background:#f5e9dd;color:#523139;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0;height:44px}button{height:44px;min-width:80px;padding:0 14px;border:0;border-radius:9px;background:#74435c;color:white;font-size:17px;cursor:pointer}button:disabled{opacity:.35}#counter{min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>
const prose=["纸路两边站起来。小河狸冬冬的红色玩具车，装着三块蓝积木，停在一条蓝布旁边。“这是小河，”冬冬说，“我要把积木运过去，摆一个停车位！”", "爸爸木舟找来两块一样高的木块，放在蓝布两边。冬冬把一张厚纸架上去。他先把积木卸在岸边，再推空车上桥，平平的桥面忽然弯了。", "爸爸伸手接住小车。冬冬把车抱回来，看看还在岸边的三块积木，叹了口气：“空车都过不去，停车位今天摆不成了。”", "“先让车休息一下。”爸爸取下纸，放平，又拿起两条长边，沿着边折出直直的折痕。冬冬凑过来：“纸路长耳朵了？”", "两条边站起来，中间留下平平的车道。爸爸把纸桥放回原来的木块上：“纸还是这一张。我们换了它的形状，再看看。”", "冬冬一只手扶在桥边，另一只手慢慢推车。轮子滚到中间，桥面只轻轻动了一下。小车过去了！冬冬赶紧伸手，把它稳稳接住。", "“两边站起来，纸就没那么容易往下弯了。”爸爸说。冬冬摸摸折痕：“不是换了更厚的纸，是纸路换了个站法！”", "小车回到岸边，冬冬把三块蓝积木摆进车斗。爸爸的手等在桥旁。冬冬慢慢推，慢慢推，这回，小车载着积木也过了河。", "他们把积木卸在对岸，摆成一个停车位。红车驶进去，车头朝着新纸桥。冬冬伸出手指比了比：“这个桥让小车走，我走旁边！”", "收玩具时，冬冬舍不得压平两条纸边。爸爸找来一个浅盒，把桥和小车一起放进去。冬冬轻轻盖好：“明天开门，纸路还站着呢。”"];let n=0;const page=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){page.src='page-'+String(n+1).padStart(2,'0')+'.png';page.alt=prose[n];counter.textContent=(n+1)+' / '+prose.length;prev.disabled=n===0;next.disabled=n===prose.length-1}function move(d){n=Math.max(0,Math.min(prose.length-1,n+d));show()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let start;page.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});page.addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)move(delta<0?1:-1)},{passive:true});show();
</script></body></html>
