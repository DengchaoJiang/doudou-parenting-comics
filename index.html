<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆豆科普绘本</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f6f4ee;
      color: #222;
    }
    body {
      margin: 0;
      padding: 32px 18px;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 24px;
      color: #5b5a55;
      font-size: 16px;
      line-height: 1.6;
    }
    .list {
      display: grid;
      gap: 12px;
    }
    a.book {
      display: block;
      padding: 18px;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      border: 1px solid #e2ded4;
    }
    a.book:active {
      transform: scale(0.99);
    }
    .date {
      display: block;
      margin-top: 6px;
      color: #706a60;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>豆豆科普绘本</h1>
    <p>这里是每日亲子录音生成的绘本入口。每本绘本都可以在 iPad 横屏下一页一页共读。</p>
    <div class="list">
      <a class="book" href="2026-07-05/">
        七颗苹果去新幼儿园
        <span class="date">2026-07-05</span>
      </a>
      <a class="book" href="2026-07-04/">
        病毒小船不要换嘴巴
        <span class="date">2026-07-04</span>
      </a>
    </div>
  </main>
</body>
</html>
