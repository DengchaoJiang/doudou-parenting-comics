<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆豆科普绘本</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f7f4ec;
      color: #222;
    }
    body {
      margin: 0;
      padding: 32px 18px;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 24px;
      color: #5c5a54;
      font-size: 16px;
      line-height: 1.6;
    }
    .empty {
      border: 1px solid #ded6c4;
      border-radius: 12px;
      background: #fffaf0;
      padding: 18px;
      line-height: 1.6;
    }
    .list {
      display: grid;
      gap: 12px;
    }
    a.book {
      display: block;
      padding: 18px;
      border-radius: 12px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      border: 1px solid #e3ded3;
    }
    a.book:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <main>
    <h1>豆豆科普绘本</h1>
    <p>这里是每日亲子录音生成的绘本入口。每本绘本会放在日期目录中，iPad 横屏打开后可以一页一页共读。</p>
    <div class="empty">
      还没有发布到这个入口的绘本。后续自动化会把每天的绘本目录链接追加到这里。
    </div>
  </main>
</body>
</html>
