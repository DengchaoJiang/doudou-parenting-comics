<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三颗月亮土豆</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#231a13; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#263c3c,#231a13); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#d8aa55; color:#2d2116; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="三颗月亮土豆">
      <article class="page active"><img src="page-01.png" alt="栗栗在月光下开纸板拖拉机进入菜园，宣布今晚要当土豆农夫。"></article>
      <article class="page"><img src="page-02.png" alt="栗栗挖出并数清三颗圆滚滚的月亮土豆。"></article>
      <article class="page"><img src="page-03.png" alt="饥饿的小刺猬在菜园篱笆外停下。"></article>
      <article class="page"><img src="page-04.png" alt="栗栗抱紧三颗土豆，爸爸让他自己想办法兼顾自己和客人。"></article>
      <article class="page"><img src="page-05.png" alt="栗栗把一颗大土豆递给小刺猬，篮中留下两颗。"></article>
      <article class="page"><img src="page-06.png" alt="栗栗伸出两根小爪子，数出三颗送走一颗后还剩两颗。"></article>
      <article class="page"><img src="page-07.png" alt="回家路上一颗土豆从篮缝滚进蓝莓丛，篮中只剩一颗。"></article>
      <article class="page"><img src="page-08.png" alt="父子沿泥点和压弯的小草，在蓝莓叶下找回土豆。"></article>
      <article class="page"><img src="page-09.png" alt="厨房里两颗土豆分进两只碗，栗栗和爸爸一人一颗。"></article>
      <article class="page"><img src="page-10.png" alt="栗栗、爸爸和小刺猬都吃饱了，三颗月亮土豆照亮三个肚子。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),current=document.querySelector('#current');let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();};next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();});render();
  </script>
</body>
</html>
