<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>风筝站的长巴士</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #162120; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) max(84px, calc(8vh + env(safe-area-inset-bottom))); }
    main { min-height: 0; display: grid; place-items: center; padding: 12px 14px 4px; }
    .page {
      display: none;
      width: auto;
      height: auto;
      max-width: min(1180px, calc(100vw - 28px));
      max-height: calc(100vh - max(100px, calc(10vh + env(safe-area-inset-bottom))));
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .32);
    }
    .page.active { display: block; }
    nav {
      display: grid;
      grid-template-columns: 96px 1fr 96px;
      align-items: center;
      gap: 12px;
      padding: 8px max(18px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      background: rgba(10, 18, 17, .96);
    }
    button { height: 48px; border: 0; border-radius: 16px; background: #f7e5af; color: #18312d; font-size: 28px; font-weight: 700; }
    button:disabled { opacity: .32; }
    output { text-align: center; color: #f6f1e5; font-size: 16px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main id="reader" aria-label="风筝站的长巴士绘本">
    <img class="page active" src="page-01.png" alt="风筝站的长巴士，第1页">
    <img class="page" src="page-02.png" alt="风筝站的长巴士，第2页">
    <img class="page" src="page-03.png" alt="风筝站的长巴士，第3页">
    <img class="page" src="page-04.png" alt="风筝站的长巴士，第4页">
    <img class="page" src="page-05.png" alt="风筝站的长巴士，第5页">
    <img class="page" src="page-06.png" alt="风筝站的长巴士，第6页">
    <img class="page" src="page-07.png" alt="风筝站的长巴士，第7页">
    <img class="page" src="page-08.png" alt="风筝站的长巴士，第8页">
    <img class="page" src="page-09.png" alt="风筝站的长巴士，第9页">
    <img class="page" src="page-10.png" alt="风筝站的长巴士，第10页">
  </main>
  <nav aria-label="翻页">
    <button id="prev" type="button" aria-label="上一页">←</button>
    <output id="count" aria-live="polite">1 / 10</output>
    <button id="next" type="button" aria-label="下一页">→</button>
  </nav>
  <script>
    const pages = [...document.querySelectorAll('.page')];
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');
    const count = document.querySelector('#count');
    let index = 0;
    function show(nextIndex) {
      index = Math.max(0, Math.min(pages.length - 1, nextIndex));
      pages.forEach((page, i) => page.classList.toggle('active', i === index));
      count.value = `${index + 1} / ${pages.length}`;
      count.textContent = count.value;
      prev.disabled = index === 0;
      next.disabled = index === pages.length - 1;
    }
    prev.addEventListener('click', () => show(index - 1));
    next.addEventListener('click', () => show(index + 1));
    addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') show(index - 1);
      if (event.key === 'ArrowRight' || event.key === ' ') show(index + 1);
    });
    let startX = null;
    addEventListener('pointerdown', event => { startX = event.clientX; });
    addEventListener('pointerup', event => {
      if (startX === null) return;
      const delta = event.clientX - startX;
      if (Math.abs(delta) > 50) show(index + (delta < 0 ? 1 : -1));
      startX = null;
    });
    show(0);
  </script>
</body>
</html>
