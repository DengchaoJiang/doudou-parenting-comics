<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>睡莲的水下信箱</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#152525; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#617d7b,#101d1c); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#e8cb72; color:#263126; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="睡莲的水下信箱">
      <article class="page active"><img src="page-01.png" alt="雨点敲着池塘，小刺猬阿栗发现圆圆的睡莲叶不会沉下去，爸爸陪他去寻找答案。"></article>
      <article class="page"><img src="page-02.png" alt="阿栗问睡莲是不是坐着小船，圆叶轻轻一晃，把一颗雨珠送回池塘。"></article>
      <article class="page"><img src="page-03.png" alt="水上邮差滑来，说圆叶是睡莲的信箱，阿栗想知道信会寄到哪里。"></article>
      <article class="page"><img src="page-04.png" alt="爸爸用长草往下比，告诉阿栗圆叶下面的长叶柄一直通到水底泥中。"></article>
      <article class="page"><img src="page-05.png" alt="阿栗贴近叶面听见咕噜声，兴奋得差点把鼻尖伸进水里。"></article>
      <article class="page"><img src="page-06.png" alt="爸爸握住阿栗的手守住岸边安全，水上邮差画出弯弯的水下路线。"></article>
      <article class="page"><img src="page-07.png" alt="泥里的根收到阳光和雨水的信，抱紧泥土，把水和养分沿叶柄送回上面。"></article>
      <article class="page"><img src="page-08.png" alt="一阵风让圆叶东摇西晃，阿栗担心睡莲会被吹走。"></article>
      <article class="page"><img src="page-09.png" alt="爸爸指出叶子会摇而根稳稳扎在泥里，风停后睡莲重新望向天空。"></article>
      <article class="page"><img src="page-10.png" alt="回家后阿栗画出睡莲的水上叶片、水下叶柄和泥中根系，明白睡莲有两层家。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),current=document.querySelector('#current');let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();};next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();});render();
  </script>
</body>
</html>
