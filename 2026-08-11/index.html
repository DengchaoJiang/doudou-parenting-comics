<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#263d35">
  <title>2026-08-11 科普绘本《门口漏掉的一小步》</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #263d35;
      color: #f4e8c6;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 34%, #7b633e 0, #263d35 74%); }
    .reader { position: fixed; inset: 0; min-height: 0; }
    .topbar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 2;
      color: #f4e8c6;
      font-size: clamp(13px, 1.8vw, 18px);
    }
    .home { color: inherit; text-decoration: none; padding: 8px 10px; }
    .counter { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
    .stage {
      position: absolute;
      top: calc(max(10px, env(safe-area-inset-top)) + 48px);
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(82px + 8vh + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .38);
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(2vh + env(safe-area-inset-bottom));
      height: 64px;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 8vw, 88px);
      z-index: 2;
    }
    button {
      min-width: clamp(120px, 22vw, 220px);
      min-height: 56px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(46, 73, 62, .96);
      color: #fff8e5;
      font: inherit;
      font-size: clamp(18px, 2.3vw, 24px);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .35; }
    button:active:not(:disabled) { transform: scale(.98); }
    @media (max-height: 540px) {
      .topbar { font-size: 13px; }
      .stage { top: 42px; bottom: calc(66px + 8vh + env(safe-area-inset-bottom)); }
      .controls { height: 52px; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="reader" aria-label="绘本阅读器">
    <header class="topbar">
      <a class="home" href="../" aria-label="返回绘本目录">‹ 绘本目录</a>
      <span class="counter" id="counter" aria-live="polite">第 1 / 10 页</span>
    </header>
    <section class="stage" id="stage">
      <img id="page" src="page-01.png" alt="雨停以后，小河狸栗栗跟着桐爸爸去松果工坊。两双雨靴踩过水洼，发出噗叽噗叽的声音。">
    </section>
    <nav class="controls" aria-label="翻页">
      <button id="prev" type="button" disabled>上一页</button>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = [
      ["page-01.png", "雨停以后，小河狸栗栗跟着桐爸爸去松果工坊。两双雨靴踩过水洼，发出噗叽噗叽的声音。"],
      ["page-02.png", "工坊门口有一块蓝垫子。栗栗记得，沾泥的雨靴留在这里，换好室内鞋才能进去。"],
      ["page-03.png", "门铃一响，桐爸爸只顾扶住差点散开的金色图纸，抱着它们跨过了蓝垫子。"],
      ["page-04.png", "地板上多出两串湿脚印，像棕色小鱼游进屋。栗栗停在门槛外，心里轻轻咚了一下。"],
      ["page-05.png", "爸爸，门口那一小步忘啦。桐爸爸低头看看雨靴，又回头看看栗栗。"],
      ["page-06.png", "真的忘了，谢谢你提醒我。桐爸爸退回蓝垫子，脱下雨靴，换上灰色室内鞋。"],
      ["page-07.png", "栗栗也换上黄色室内鞋。两个人一起擦地，一条、两条、三条，小鱼脚印慢慢不见了。"],
      ["page-08.png", "最后一条脚印擦掉时，桐爸爸指着门边：栗栗，你的小水壶也漏在那一步啦。"],
      ["page-09.png", "栗栗笑出两个小门牙：原来会记得的人，也会忘记呀。他拿回水壶，慢慢走过干净的地板。"],
      ["page-10.png", "那天，他们用许多短木板造好一座桥，一块也没有漏。回家时，两个人在门口一起停下：先看脚，再看手里的东西。"]
    ];
    let current = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current][0];
      image.alt = pages[current][1];
      counter.textContent = `第 ${current + 1} / ${pages.length} 页`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }
    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
    });
    let touchStartX = 0;
    document.getElementById("stage").addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.getElementById("stage").addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
  </script>
</body>
</html>
