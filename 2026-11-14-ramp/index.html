<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小车慢慢到车站｜2026-11-14</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#192f32;color:#fff}body{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));gap:8px;font-family:system-ui,sans-serif;overflow:hidden}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}img{display:block;width:100%;height:100%;object-fit:contain;user-select:none}nav{flex:none;min-height:48px;display:flex;align-items:center;justify-content:center;gap:18px}button{font:inherit;font-size:18px;min-height:46px;min-width:100px;padding:8px 18px;color:#192f32;background:#f7e9c9;border:0;border-radius:12px;cursor:pointer}button:disabled{opacity:.35}output{min-width:70px;text-align:center;font-size:18px}button:focus-visible{outline:3px solid white;outline-offset:3px}</style></head><body>
<main id="reader" aria-label="小车慢慢到车站，十页绘本"><img id="page" src="page-01.webp" alt="石头在地板上搭了一座车站。红色小货车要去送松果，可他轻轻一放手，小车却停在半路，离车站还差好远。" draggable="false"></main>
<nav aria-label="绘本翻页"><button id="prev" type="button">上一页</button><output id="count" aria-live="polite">1 / 10</output><button id="next" type="button">下一页</button></nav>
<script>const prose=["石头在地板上搭了一座车站。红色小货车要去送松果，可他轻轻一放手，小车却停在半路，离车站还差好远。", "“它是不是累了？”石头蹲下来，替小车吹了吹轮子。爸爸也趴下看了看，笑着说：“我们给它换一条出发的路吧。”", "爸爸把木板的一头垫高了一点，又扶稳下面的积木。石头把红车放回坡顶，手指松开，没有再推它。", "小车咕噜噜滑下来，越过刚才停车的地方，竟从车站旁边跑过去了。松果在车厢里晃了晃，像在找站台。", "“这次跑得太远啦！”石头把一块软布铺在前面，等小车停好，才把它抱回来。他想让松果正好在车站下车。", "爸爸没有挪动车站，只把坡道降低了一些。石头还是用同一辆车，从坡顶轻轻放手。这一回，小车慢了下来。", "小车停在站台边，石头高兴得拍起手来。他又试了两回，有时差一点，有时过一点，车站始终没有搬家。", "石头望望高坡，又看看低坡。“刚才出发的地方高一些，它就跑得快一些。”他用手指画了一条往下的小路。", "爸爸点点头：“今天这条路上，是这样。换一辆车，或者换一块地毯，我们还得重新试。”石头把多余的积木收好。", "最后，松果稳稳地坐到了站台上。石头把红车停进车库，小声告诉它：“明天再开车，今天你已经送到啦。”"];let current=0;const pic=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function show(n){current=Math.max(0,Math.min(prose.length-1,n));pic.src='page-'+String(current+1).padStart(2,'0')+'.webp';pic.alt=prose[current];count.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;if(current<prose.length-1){const preload=new Image();preload.src='page-'+String(current+2).padStart(2,'0')+'.webp'}}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});let startX=null;const reader=document.getElementById('reader');reader.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});reader.addEventListener('touchend',e=>{if(startX===null)return;const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>60)show(current+(delta<0?1:-1));startX=null},{passive:true});show(0);</script></body></html>
