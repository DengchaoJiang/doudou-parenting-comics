<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月亮停车场只收三辆车</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background:#17130f; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#32285a,#17130f); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#fff3d0; color:#24180e; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="月亮停车场只收三辆车">
      <article class="page active"><img src="page-01.png" alt="晚饭后的地毯变成了长长的公路。栗栗推着车队喊：今晚谁也不许睡觉，我们要一直开到月亮上！"></article>
      <article class="page"><img src="page-02.png" alt="星星钟响起，爸爸说明月亮停车场今晚只收三辆车。"></article>
      <article class="page"><img src="page-03.png" alt="栗栗把七辆车叠成高塔，车塔摇摇晃晃。"></article>
      <article class="page"><img src="page-04.png" alt="爸爸接住车塔，理解栗栗的愿望，同时守住三个车位的边界。"></article>
      <article class="page"><img src="page-05.png" alt="月亮停车场开起了热闹的车辆面试会。"></article>
      <article class="page"><img src="page-06.png" alt="栗栗用三颗星星选择今晚最想陪伴自己的三辆车。"></article>
      <article class="page"><img src="page-07.png" alt="三辆车进入月亮停车场，其他车去星星车库充电。"></article>
      <article class="page"><img src="page-08.png" alt="紫车偷偷回来，栗栗发现四辆车挤得轮子碰轮子。"></article>
      <article class="page"><img src="page-09.png" alt="栗栗把紫车送回星星车库，为其他车盖上小毯子。"></article>
      <article class="page"><img src="page-10.png" alt="栗栗安心入睡，梦见明天建造更长、更聪明的公路。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')], prev=document.querySelector('#prev'), next=document.querySelector('#next'), current=document.querySelector('#current'); let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();}; next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();}); render();
  </script>
</body>
</html>
