<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雷雨云的闪电鼓</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#101a2c; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#405779,#0c1322); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#f1c94b; color:#192238; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="雷雨云的闪电鼓">
      <article class="page active"><img src="page-01.png" alt="大雨敲窗，团团问爸爸云里谁在打鼓，雨从哪里来。"></article>
      <article class="page"><img src="page-02.png" alt="爸爸点亮云朵灯，带团团跟随暖湿空气进入雷雨云。"></article>
      <article class="page"><img src="page-03.png" alt="太阳晒暖地面，湿空气上升冷却，形成小水滴和小冰晶。"></article>
      <article class="page"><img src="page-04.png" alt="云中上升和下沉气流让冰晶、冰粒与水滴碰撞并分开电荷。"></article>
      <article class="page"><img src="page-05.png" alt="雷雨云上下区域聚起不同电荷，空气逐渐拦不住放电。"></article>
      <article class="page"><img src="page-06.png" alt="闪电先照亮黑云，团团捂住耳朵等待雷声。"></article>
      <article class="page"><img src="page-07.png" alt="闪电瞬间加热空气，空气膨胀并推动震动形成雷声。"></article>
      <article class="page"><img src="page-08.png" alt="光传播得比声音快，所以先看到闪电后听到雷。"></article>
      <article class="page"><img src="page-09.png" alt="水滴不断合并变重，上升气流托不住时便落成雨。"></article>
      <article class="page"><img src="page-10.png" alt="父子在安全室内回顾闪电、雷声与雨的成因。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),current=document.querySelector('#current');let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();};next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();});render();
  </script>
</body>
</html>
