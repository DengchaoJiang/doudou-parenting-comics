<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>咚声藏在哪儿</title><style>*{box-sizing:border-box}body{margin:0;background:#253b42;color:#fff;font:18px system-ui}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 8px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-width:100%;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 60px)}nav{display:flex;align-items:center;gap:14px;height:44px;flex-shrink:0}button{border:0;border-radius:8px;min-height:44px;padding:0 12px;background:#f8dfa9;color:#253b42;font:inherit}button:disabled{opacity:.5}a{color:#f8dfa9}</style><body><main><img id="page" src="page-01.webp" alt=""><nav aria-label="绘本翻页"><a href="../">首页</a><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>const images=["page-01.webp","page-02.webp","page-03.webp","page-04.webp","page-05.webp","page-06.webp","page-07.webp","page-08.webp","page-09.webp","page-10.webp"],story=["海边起雾了。小企鹅星屿把三只布偶排在窗下，给它们办一场提灯游行。他抱来小鼓，准备敲一声出发。","他刚敲一下，睡在摇篮里的妹妹就动了动小脚。星屿赶紧抱住鼓，小声问爸爸墨帆：“咚声住在鼓肚子里吗？”","墨帆从抽屉里取出一长条薄纸，平放在鼓面上。“我们请这条纸来帮忙。”星屿把脸凑近，等纸条告诉他。","星屿用一根手指轻轻敲鼓面。咚！躺着的纸条忽然跳了起来，一头高，一头低，落回去时还抖了两下。","他又把手抬起来。这回他只是举着手，鼓面安安静静，纸条也躺着。星屿等了一会儿，连一声咚也没听见。","爸爸指给他看：“刚才鼓面在飞快地来回动，叫作振动。它让旁边的空气也跟着振动，声音就传到了你的耳朵。”","纸条放在一旁。墨帆用手掌轻轻按住鼓面，星屿敲了一下还露着的那一边。这回，只听见短短的一声噗。","星屿也试了试。手掌一贴上去，鼓面就更快停下来，声音也短了。他转头一看，妹妹又睡熟了。","他把提灯放在窗边，给布偶发明了新的走路声。他轻轻敲一下，再把手掌贴回去，等一等才敲下一下。","游行走完一圈，星屿把鼓和三只布偶放回架子上。妹妹的小脚还露在外面，他把毯子轻轻往下拉了一点。"];const page=document.querySelector("#page"),prev=document.querySelector("#prev"),next=document.querySelector("#next"),counter=document.querySelector("#counter");let i=0,start;function show(n){i=Math.min(images.length-1,Math.max(0,n));page.src=images[i];page.alt=story[i];counter.textContent=(i+1)+" / "+images.length;prev.disabled=i===0;next.disabled=i===images.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1)});page.addEventListener("touchstart",e=>start=e.changedTouches[0].clientX,{passive:true});page.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});show(0)</script></body></html>
