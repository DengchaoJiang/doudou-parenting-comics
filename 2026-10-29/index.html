<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>牛奶车的小秘密｜2026-10-29</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#132d34;color:#fff;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}#page{display:block;max-width:100%;width:auto;height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);object-fit:contain}nav{display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0;height:44px}button,a{font:inherit;color:inherit}button{min-width:72px;height:44px;border:1px solid #8aadb2;border-radius:10px;background:#294a52}button:disabled{opacity:.35}#counter{min-width:60px;text-align:center}a{font-size:14px;text-underline-offset:3px}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev" type="button">上一页</button><span id="counter" aria-live="polite"></span><button id="next" type="button">下一页</button><a href="../">书架</a></nav></main><script>const prose=["《牛奶车的小秘密》小獾圆圆把空酸奶盒装上木头货车：“我要去奶牛那里装酸奶！”爸爸杉岳笑了：“奶牛给的是牛奶，酸奶又是哪里来的呢？”", "圆圆看看杯里晃动的牛奶，又看看勺上厚厚的酸奶：“它们明明不一样呀。”爸爸拿出工坊开放日的邀请卡：“我们去找找牛奶车中途停在哪里。”", "收好玩具后，他们来到乳品工坊。玻璃外停着奶罐车。水獭青禾说：“送来的是牛奶，做酸奶还要请小帮手。”圆圆只看见罐子和管道：“帮手藏在哪儿？”", "青禾打开图册，纸上画着小杆和小球。“这是乳酸菌的放大示意，真的菌小得多，眼睛看不见。”圆圆松开爸爸的袖子，笑了：“原来不是躲着不出来！”", "“工作人员把选好的菌种加入处理好的牛奶。在合适的条件下，它们利用奶里的糖，产生乳酸。”圆圆轻轻念：“乳酸——酸奶的酸，就是这样来的呀！”", "图册翻到牛奶变稠的一页。青禾说：“酸度改变，奶里的蛋白质会聚成细细的网，留住许多水分。”圆圆想起勺上的酸奶：“难怪它不马上流走！”", "“那把牛奶放桌上等，也能做酸奶？”圆圆问。爸爸蹲下来：“随便放可能变坏。工坊要控制菌种、温度和卫生，可不是只等一等。”圆圆认真望着罐子。", "参观完，他们选了一盒原味酸奶。爸爸核对包装和冷藏要求，把它放进保冷袋。回家路上，圆圆心里画着路线：从奶牛那里出发，到工坊，再到冷藏的小店。", "爸爸把酸奶收进冰箱，圆圆拿出木头货车，用积木搭工坊和冷藏店。“这次不直接装酸奶了！”他慢慢开过两站，爸爸扶住摇晃的积木，等他接好路。", "吃点心时，圆圆舀起一勺酸奶：“我以前只知道它酸酸的，现在知道它走过好几站。”爸爸碰了碰他的勺柄：“是你的问题，带我们找到了这条路。”", "夜里，货车停回窗台。圆圆钻进被窝，又问：“那奶酪呢，也请过小帮手吗？”爸爸拉开被子：“明天接着找。”窗外静静的，牛奶车也在等下一次出发。"];let current=0;const picture=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next');function show(n){current=Math.max(0,Math.min(prose.length-1,n));picture.src='page-'+String(current+1).padStart(2,'0')+'.png';picture.alt=prose[current];document.querySelector('#counter').textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);});let x;picture.addEventListener('touchstart',e=>{x=e.changedTouches[0].clientX;},{passive:true});picture.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x;if(Math.abs(dx)>45)show(current+(dx<0?1:-1));},{passive:true});show(0);</script></body></html>
