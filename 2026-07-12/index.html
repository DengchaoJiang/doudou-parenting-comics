<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>皮肤里的小伞工厂</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#162b32; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#294f5a,#162b32); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#fff3d0; color:#24180e; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="皮肤里的小伞工厂">
      <article class="page active"><img src="page-01.png" alt="小满发现自己的胳膊晒深了一点，好奇地询问爸爸。"></article>
      <article class="page"><img src="page-02.png" alt="爸爸用魔法小镜子带小满看见皮肤里的小伞工厂。"></article>
      <article class="page"><img src="page-03.png" alt="紫外线落下，小墨点工人敲铃出发保护皮肤小镇。"></article>
      <article class="page"><img src="page-04.png" alt="小墨点们撑开许多深色小伞，挡住落向皮肤的光线。"></article>
      <article class="page"><img src="page-05.png" alt="不同皮肤小镇用不同速度和方式应对阳光。"></article>
      <article class="page"><img src="page-06.png" alt="阳光变强，小伞们开始疲惫，需要外面的帮助。"></article>
      <article class="page"><img src="page-07.png" alt="小满戴帽子、涂防晒霜，为皮肤小镇请来外援。"></article>
      <article class="page"><img src="page-08.png" alt="父子沿树荫玩耍并及时喝水，让皮肤小镇凉快下来。"></article>
      <article class="page"><img src="page-09.png" alt="流汗后小满主动请爸爸帮忙补涂防晒霜。"></article>
      <article class="page"><img src="page-10.png" alt="夕阳下父子依偎，小墨点们收伞休息，约好继续保护皮肤。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),current=document.querySelector('#current');let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();};next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();});render();
  </script>
</body>
</html>
