<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谁给水坑盖了窗户</title><style>*{box-sizing:border-box}body{margin:0;background:#41322d;color:#fff;font:18px system-ui}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 8px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-width:100%;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 60px);width:auto;height:auto}nav{display:flex;align-items:center;gap:14px;flex-shrink:0;height:44px}button{border:0;border-radius:8px;min-height:44px;padding:0 12px;background:#f0dcae;color:#302019;font:inherit}button:disabled{opacity:.5}a{color:#f0dcae}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="绘本翻页"><a href="../">首页</a><button id="prev" disabled>上一页</button><span id="counter" aria-live="polite">1 / 10</span><button id="next">下一页</button></nav></main><script>const files=["page-01.png","page-02.png","page-03.png","page-04.png","page-05.png","page-06.png","page-07.png","page-08.png","page-09.png","page-10.png"], prose=["回家路上，河狸小满指着路边的水坑。昨天它还在晃，今天却托住了一片叶子。叶子连一点水纹也没激起来。","“谁给水坑盖了窗户？”小满问。爸爸松原停在干路上，陪他看了一会儿。薄薄的冰下面，还有会晃动的水。","到了家，小满还惦记着那扇窗户。他找来一蓝一黄两只一样大的碟子，请爸爸在每只碟子里倒一小勺清水。","小满把两只碟子轻轻晃了晃。水都跑向了低下去的那边。他猜，要是有一只碟子变冷，水也许就不跑了。","爸爸把蓝碟子放进冷冻室，把黄碟子留在桌上。小满想马上拉开门，手伸到一半，又缩回来和爸爸去吃饭。","吃过晚饭，爸爸端回蓝碟子。小满盯着那层亮亮的冰，请爸爸把碟子斜一斜。冰稳稳地贴着碟底。","轮到黄碟子时，水沿着碟边晃了一圈。小满笑了：“刚刚明明都是水！”他把两只碟子并排摆好。","“冷冻室够冷，水在那里待久了，就结成冰。”爸爸说。小满想起那片叶子，原来昨夜的冷也能给水坑做一扇冰窗。","小满把蓝碟子留在屋里，想看看冰窗会不会打开。临睡前，他发现冰边已围起一圈水，轻轻一晃就动了。","第二天早上，蓝碟子里也只剩清水了。小满把碟子端给爸爸看：“冰窗打开啦！”一圈小水纹在晨光里亮起来。"];const page=document.querySelector("#page"),prev=document.querySelector("#prev"),next=document.querySelector("#next"),counter=document.querySelector("#counter");let i=0,start;function show(n){i=Math.min(files.length-1,Math.max(0,n));page.src=files[i];page.alt=prose[i];counter.textContent=(i+1)+" / "+files.length;prev.disabled=i===0;next.disabled=i===files.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1)});page.addEventListener("touchstart",e=>{start=e.changedTouches[0].clientX},{passive:true});page.addEventListener("touchend",e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)show(i+(delta<0?1:-1))},{passive:true});show(0)</script></body></html>
