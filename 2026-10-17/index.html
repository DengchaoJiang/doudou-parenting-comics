<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>伸开四只小脚</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#202d2b;color:#fff;font-family:system-ui}main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 42px;gap:6px;padding:8px 10px calc(8vh + env(safe-area-inset-bottom));}#page{width:100%;height:100%;object-fit:contain;min-height:0;display:block}nav{display:flex;gap:18px;justify-content:center;align-items:center}button{border:0;border-radius:9px;padding:9px 22px;min-height:40px;background:#e6e8d8;color:#152a28;font-size:16px}button:disabled{opacity:.4}#counter{min-width:70px;text-align:center}</style></head>
<body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main><script>
const prose=["《伸开四只小脚》 秋天的下午，小獾冬冬把积木站台摆在客厅地毯上。最后一辆玩具巴士还没到，他想在站台顶上插一面蓝旗：“这样，司机老远就能看见啦。”","站台有点高，冬冬把一只小篮子接在玩具车的长臂上。篮子慢慢升起来，蓝旗还没送到屋顶，车身就歪了。冬冬赶紧扶住它，旗子滑到了地毯上。","他把长臂按得更紧，又试了一次。车子还是向旁边歪。“我都装好了，为什么不肯站住？”冬冬捡起蓝旗，耳朵耷拉下来。松岩爸爸放下手里的杯子，坐到旁边。","“你想把旗送到哪里？”爸爸问。冬冬指了指站台顶：“这里。可它一伸手，就要摔。”爸爸没有拆掉长臂，只把小车轻轻放回原处：“我们看看下面呢？”","冬冬趴下来，看见车底四根短支脚都贴着车身。他想起白天看过的作业车：“那辆车的脚是伸开的！”爸爸扶住车，冬冬把四根支脚一根根展开。","冬冬把蓝旗放回篮里。他们没有换长臂，也没换篮子，只把底下的支脚撑宽。爸爸慢慢扶起长臂，这回蓝旗升高了，小车没有像刚才那样立刻歪下去。冬冬的耳朵又竖了起来。","“原来它不只靠轮子站着！”冬冬围着车看。爸爸指着展开的支脚：“脚撑开，底下托住它的地方更宽了。这辆玩具车举起同样的篮子，就比较不容易倒。”","冬冬刚要继续，车身轻轻晃了一下。他的小爪停在半空。原来一只支脚踩着折起的地毯边，另外一只悬着，没有落地。“它还有一只脚没站好！”冬冬说。","爸爸把整辆车移到旁边平整的地板上，再陪冬冬检查四只脚。每只都落好了，冬冬才慢慢抬起长臂。篮子稳稳停在站台边，蓝旗终于碰到了屋顶。","冬冬把旗插进屋顶的小孔，再降下空篮子。那辆迟迟没进站的巴士，被他轻轻推过来。“看见蓝旗了吗？这里就是你的站！”他替司机说：“看见啦！”","收玩具时，冬冬舍不得合起四只支脚。爸爸笑了：“真车可不是撑开脚就能随便开，要由会操作的大人检查地面和整辆车。我们这辆小车，也先把长臂放好再收。”","冬冬把长臂放低，合好支脚，让小车挨着站台过夜。蓝旗还在屋顶。他拍拍车身，小声说：“今天不是你的手不够长，是我们先帮你的脚站好了。”"];let current=0;const picture=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');
function show(){picture.src='page-'+String(current+1).padStart(2,'0')+'.png';picture.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;}
function move(delta){current=Math.max(0,Math.min(prose.length-1,current+delta));show();}
prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);};let start;picture.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});picture.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)move(delta<0?1:-1);},{passive:true});show();
</script></body></html>
