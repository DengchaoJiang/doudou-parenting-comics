<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>铃声响了，栗栗再出发 · 2026-09-12</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#161b21;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 10px 0;touch-action:pan-y}
img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
nav{flex:none;min-height:calc(8vh + env(safe-area-inset-bottom));padding:8px 10px max(8px,env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:center}
button,a{font:inherit;font-size:16px;border:1px solid #677481;border-radius:10px;padding:10px 16px;min-height:44px;background:#27333e;color:#fff;text-decoration:none;cursor:pointer}
button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #ffd277;outline-offset:3px}
output{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
#retry[hidden]{display:none}@media(max-width:560px){nav{gap:6px}button,a{padding:8px 10px;font-size:14px}}
</style>
</head>
<body>
<main aria-label="铃声响了，栗栗再出发"><img id="page" src="page-01.png" alt="小松鼠栗栗用松果和纸盒，造了一辆圆滚滚的公交车。"></main>
<nav aria-label="绘本翻页"><a href="../">绘本目录</a><button id="prev" type="button">上一页</button><output id="count" aria-live="polite">1 / 10</output><button id="next" type="button">下一页</button><button id="retry" type="button" hidden>图片未加载，重试</button></nav>
<script>
const texts=["小松鼠栗栗用松果和纸盒，造了一辆圆滚滚的公交车。","他想去风坡公园试车。河狸爸爸扣好安全带：‘坐稳，我们出发。’","栗栗从半坡滑下，马上喊：‘太快啦！我有点怕！’","爸爸陪他回到低低的起点。这里刚刚好，栗栗又想再来一次。","爸爸翻开叶子沙漏：‘五分钟后，你选最后一次，然后我们去果子店。’","最后一片叶子落下，栗栗抱住滑板：‘我还想玩。’","爸爸蹲下来：‘你还想玩，我知道。选最后一个动作，我们就出发。’","路上看见果子店，栗栗急着下车，手伸向还在行驶的安全扣。","爸爸立刻停稳小车：‘车在动，扣子不解。车停稳，我说可以，你再自己来。’","到了门口，栗栗等车停稳才解开扣子：‘铃声会响，车也会停。我知道什么时候再出发。’"];
const page=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count'),retry=document.getElementById('retry');
let current=0,busy=false,pending=0,serial=0;
const source=n=>'page-'+String(n+1).padStart(2,'0')+'.png';
function controls(){prev.disabled=busy||current===0;next.disabled=busy||current===9}
function show(n){
 n=Math.max(0,Math.min(9,n));pending=n;const ticket=++serial;busy=true;retry.hidden=true;controls();
 const candidate=new Image();
 candidate.onload=()=>{if(ticket!==serial)return;page.src=candidate.src;page.alt=texts[n];current=n;busy=false;count.value=(n+1)+' / 10';document.body.dataset.page=String(n+1);history.replaceState(null,'','#'+(n+1));controls();if(n<9){const prefetch=new Image();prefetch.src=source(n+1)}};
 candidate.onerror=()=>{if(ticket!==serial)return;busy=false;retry.hidden=false;controls()};
 candidate.src=source(n);
}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);retry.onclick=()=>show(pending);
document.addEventListener('keydown',e=>{if(busy)return;if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});
let touchStart=null;
page.addEventListener('touchstart',e=>{touchStart=e.touches[0].clientX},{passive:true});
page.addEventListener('touchend',e=>{if(touchStart===null)return;const delta=e.changedTouches[0].clientX-touchStart;touchStart=null;if(!busy&&Math.abs(delta)>50)show(current+(delta<0?1:-1))},{passive:true});
const initial=Number(location.hash.slice(1));show(Number.isInteger(initial)&&initial>=1&&initial<=10?initial-1:0);
</script>
</body>
</html>
