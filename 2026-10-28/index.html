<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>带回家的彩虹 · 2026-10-28</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#283235;color:white;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}#page{display:block;width:100%;height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);min-height:0;object-fit:contain}nav{height:44px;flex:none;display:flex;gap:24px;align-items:center}button,a{font:inherit;color:white;background:#43534b;border:1px solid #91a69c;border-radius:10px;padding:10px 16px;text-decoration:none}button:disabled{opacity:.35}#counter{min-width:66px;text-align:center}
</style></head><body><main><img id="page" src="page-01.png" alt="带回家的彩虹，封面"><nav aria-label="翻页"><button id="prev" disabled>上一页</button><span id="counter" aria-live="polite">1 / 11</span><button id="next">下一页</button><a href="../">书架</a></nav></main><script>
let current=1;const total=11;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function turn(step){current=Math.max(1,Math.min(total,current+step));image.src=`page-${String(current).padStart(2,'0')}.png`;image.alt=`带回家的彩虹，第${current}页`;counter.textContent=`${current} / ${total}`;prev.disabled=current===1;next.disabled=current===total}prev.onclick=()=>turn(-1);next.onclick=()=>turn(1);document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')turn(-1);if(event.key==='ArrowRight')turn(1)});let start;image.addEventListener('touchstart',event=>{start=event.changedTouches[0].clientX},{passive:true});image.addEventListener('touchend',event=>{const delta=event.changedTouches[0].clientX-start;if(Math.abs(delta)>50)turn(delta<0?1:-1)},{passive:true});
</script></body></html>
