<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>白南瓜的橙色秘密</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#202b32;color:#fff;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));gap:10px}#page{display:block;min-height:0;flex:1;width:100%;object-fit:contain}nav{display:flex;justify-content:center;align-items:center;gap:22px;flex:none}button,a{border:0;border-radius:10px;background:#fff3dc;color:#23313a;padding:12px 18px;font-size:16px;min-height:44px;text-decoration:none}button:disabled{opacity:.4}#counter{min-width:70px;text-align:center}
</style></head><body><main><img id="page" src="page-01.png" alt="白南瓜的橙色秘密"><nav aria-label="翻页"><a href="../">书架</a><button id="prev" type="button">上一页</button><span id="counter">1 / 10</span><button id="next" type="button">下一页</button></nav></main><script>
const prose=["白南瓜的橙色秘密","秋天的菜店里，小仓鼠阿栗跟着爸爸挑晚饭用的菜。橙色南瓜旁边蹲着一颗白南瓜，圆滚滚的，像穿了件奶白外套。阿栗停下了小篮子。","“爸爸，它怎么是白的？是不是还没熟？”阿栗弯下腰，看了又看。爸爸也蹲下来：“我还不知道这颗是什么品种。我们问问卖菜的刺猬叔叔吧。”","刺猬叔叔指着白南瓜说：“这种南瓜熟了，皮也是白的。我种过它们，从收下来的时候就这样。”阿栗开心地说：“原来它不用等着变橙色呀！”","阿栗把小爪子搭在篮沿：“那它里面也是白的吗？”爸爸笑着摇摇头：“只看外皮，我还猜不出来。先问清楚能不能做菜，再决定带不带回家。”","刺猬叔叔帮他们挑了一颗能做菜的白皮南瓜。爸爸付好钱，把它放进大布袋。阿栗提着空空的小篮子走在旁边，心里一直装着那个没打开的问题。","回到家，爸爸洗净南瓜，放稳砧板。阿栗想凑近，爸爸请他退到桌子另一边：“刀由我来用。切开以后，我把里面转过来给你看。”阿栗点点头。","爸爸切开南瓜，收好刀，再把半颗南瓜转向阿栗。白白的皮里面，竟然是橙色的瓜肉！阿栗的耳朵立起来了：“它把橙色藏在里面啦！”","爸爸指给他看：“这是这一种南瓜原本的样子。白皮南瓜有不同品种，里面不一定都一样。”阿栗隔着桌子比了比：“只看外套，真猜不准里面。”","做晚饭时，阿栗拿来画纸，画了一个白圆圈，又在中间涂上橙色。爸爸走过来，他把画举高：“不是没熟，也不是白到底。这是我们切开看见的！”"];let index=0;const picture=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){picture.src='page-'+String(index+1).padStart(2,'0')+'.png';picture.alt=prose[index];counter.textContent=(index+1)+' / '+prose.length;prev.disabled=index===0;next.disabled=index===prose.length-1}function move(step){index=Math.max(0,Math.min(prose.length-1,index+step));show()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});let touchX=null;picture.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});picture.addEventListener('touchend',e=>{if(touchX!==null){const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)move(dx<0?1:-1)}touchX=null},{passive:true});show();
</script></body></html>
