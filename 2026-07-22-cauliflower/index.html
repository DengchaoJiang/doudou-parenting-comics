<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>花菜的白云工厂</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#13251b; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#61745a,#12251b); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#e7c968; color:#18311f; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="花菜的白云工厂">
      <article class="page active"><img src="page-01.png" alt="豆豆捏着一粒花菜种子，和爸爸准备把它种进湿润的土里。"></article>
      <article class="page"><img src="page-02.png" alt="花菜种子吸水裂开，胚根向下生长，嫩芽向上伸出。"></article>
      <article class="page"><img src="page-03.png" alt="花菜幼苗先长出子叶，再长出边缘起伏的真叶。"></article>
      <article class="page"><img src="page-04.png" alt="豆豆和爸爸让花菜幼苗逐渐适应户外，然后移栽进菜园。"></article>
      <article class="page"><img src="page-05.png" alt="根吸收水和养分，大片绿叶利用阳光制造生长能量。"></article>
      <article class="page"><img src="page-06.png" alt="宽大叶片中央出现一颗白色小花球，爸爸解释它是未开放的花序。"></article>
      <article class="page"><img src="page-07.png" alt="豆豆观察花球由许多紧密的小花蕾和短花梗组成。"></article>
      <article class="page"><img src="page-08.png" alt="稳定水分和偏凉天气帮助花球长好，外叶遮护白色花球。"></article>
      <article class="page"><img src="page-09.png" alt="花球紧实时采收，未采收的花球会松开并开出淡黄色小花。"></article>
      <article class="page"><img src="page-10.png" alt="豆豆在厨房掰开花菜观察分枝和花蕾，与爸爸一起端上餐桌。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),current=document.querySelector('#current');let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();};next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();});render();
  </script>
</body>
</html>
