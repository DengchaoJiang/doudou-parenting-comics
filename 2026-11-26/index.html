<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>绒舟看见水珠的脚印</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#191824;color:#ffefd7;font:1rem system-ui,sans-serif}
main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto;padding:1.5vh 1vw calc(8vh + env(safe-area-inset-bottom));gap:1vh}
figure{margin:0;min-height:0;touch-action:pan-y}
img{display:block;width:100%;height:100%;object-fit:contain}
nav{display:flex;align-items:center;justify-content:center;gap:1rem}
button{min-width:5rem;min-height:44px;border:1px solid #9683a7;border-radius:.65rem;color:inherit;background:#373044;font:inherit}
button:disabled{opacity:.45}
</style></head>
<body><main><figure aria-label="绒舟看见水珠的脚印"><img id="art" src="page-01.webp" alt="窗外下着小雨。小树懒绒舟和爸爸坐在餐馆的窗边，等一张还在烤的披萨。" draggable="false"></figure>
<nav aria-label="翻页"><button id="previous" type="button">上一页</button><output id="number" aria-live="polite">第 1 页，共 10 页</output><button id="next" type="button">下一页</button></nav></main>
<script>
const prose = ["窗外下着小雨。小树懒绒舟和爸爸坐在餐馆的窗边，等一张还在烤的披萨。","披萨送来了，饼边鼓出一个圆包。一缕白气升起来，绒舟往椅背上一靠，说它冒烟啦。","爸爸把热盘子端到桌子中间。绒舟隔着半张桌子看，白气升到半空，慢慢就不见了。","绒舟正想问白气去了哪儿，一转头，看见窗上蒙了一层白雾。窗边湿漉漉的，像刚醒来。","爸爸指着窗上的雾说，屋里的水汽碰到冷玻璃，会变成小水珠。绒舟凑近窗边看。","两颗水珠挨到一起，合成一颗大的。它顺着玻璃滑下来，在白雾里划开一条细路。","爸爸说，热披萨也会放出水汽。水汽遇到凉一点的空气，变成许多小水珠，看着就像白雾。","绒舟看了看披萨，又看了看玻璃。他指着窗上的小路说，这边的小水珠能留下脚印。","披萨放凉了一些，白气也淡了。爸爸试过温度，把一块放进绒舟的小盘子里。","绒舟咬了一口，饼边咔嚓一声。窗上的水珠还在走，他沿着那条小路，看见了外面的灯。"];
const art = document.querySelector('#art');
const previous = document.querySelector('#previous');
const next = document.querySelector('#next');
const number = document.querySelector('#number');
let current = 0;
const pageName = index => 'page-' + String(index + 1).padStart(2, '0') + '.webp';
function show(index) {
  current = Math.max(0, Math.min(prose.length - 1, index));
  art.src = pageName(current);
  art.alt = prose[current];
  number.textContent = '第 ' + (current + 1) + ' 页，共 ' + prose.length + ' 页';
  previous.disabled = current === 0;
  next.disabled = current === prose.length - 1;
  if (!next.disabled) new Image().src = pageName(current + 1);
}
previous.onclick = () => show(current - 1);
next.onclick = () => show(current + 1);
addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') show(current - 1);
  if (event.key === 'ArrowRight') show(current + 1);
});
let startX;
art.addEventListener('touchstart', event => {startX = event.changedTouches[0].clientX;}, {passive:true});
art.addEventListener('touchend', event => {
  const delta = event.changedTouches[0].clientX - startX;
  if (Math.abs(delta) > 45) show(current + (delta < 0 ? 1 : -1));
}, {passive:true});
show(0);
</script></body></html>
