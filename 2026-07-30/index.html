<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17120d">
  <title>纸箱公交的三次试坐</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #17120d;
      color: #fff8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      touch-action: pan-y;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 44px rgb(0 0 0 / 45%);
      user-select: none;
      -webkit-user-drag: none;
    }
    button {
      position: absolute;
      top: 50%;
      translate: 0 -50%;
      width: 54px;
      height: 76px;
      border: 0;
      border-radius: 14px;
      background: rgb(23 18 13 / 68%);
      color: #fff8e8;
      font-size: 34px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: 0.22; cursor: default; }
    #prev { left: max(14px, env(safe-area-inset-left)); }
    #next { right: max(14px, env(safe-area-inset-right)); }
    #counter {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      min-width: 58px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgb(23 18 13 / 72%);
      text-align: center;
      font-size: 14px;
      line-height: 1;
    }
    @media (max-width: 760px) {
      button { width: 44px; height: 64px; font-size: 28px; }
    }
  </style>
</head>
<body>
  <main aria-label="《纸箱公交的三次试坐》绘本阅读器">
    <img id="page" src="page-01.png" alt="">
    <button id="prev" type="button" aria-label="上一页">‹</button>
    <button id="next" type="button" aria-label="下一页">›</button>
    <div id="counter" aria-live="polite">1 / 10</div>
  </main>
  <script>
    const pages = [
      "page-01.png",
      "page-02.png",
      "page-03.png",
      "page-04.png",
      "page-05.png",
      "page-06.png",
      "page-07.png",
      "page-08.png",
      "page-09.png",
      "page-10.png"
    ];
    const descriptions = [
      "森林广场要办纸箱车节。兔子男孩卷卷用三个大纸箱，造了一辆橙色公交。",
      "卷卷画好圆车窗，又把蓝座椅放在正中：柏爸爸，第一位乘客请上车！",
      "柏爸爸刚坐下，长腿就顶住纸板。卷卷推推膝盖，可腿不是纸吸管，怎么也藏不进去。",
      "卷卷抱着耳朵，以为公交坏了。柏爸爸说：它只是听见新消息，乘客的腿有长有短。",
      "卷卷用短纸带量自己，用长纸带量爸爸，又在地板上画出两道不同的脚印线。",
      "他们把座椅往后挪，长腿舒服了，后门却撞上椅背。卷卷叹气：门又生气啦！",
      "柏爸爸问：公交要同时做好什么？卷卷数着手指：坐得下，门能开，中间还能走。",
      "卷卷把座椅移向左边，右边加上小脚台，再用木片卡住底座。第二次试坐，过道却只剩细缝。",
      "卷卷拿掉多余的装饰箱，过道立刻宽了。第三次试坐，阿岚、米米和球婆婆都找到了合适的位置。",
      "纸箱公交没有真轮子，却载着笑声绕了三圈。卷卷说：好座位不是叫身体挤一挤，而是先听身体怎么说。"
    ];
    const image = document.querySelector("#page");
    const previous = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const counter = document.querySelector("#counter");
    let current = 0;
    let touchStartX = 0;

    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current];
      image.alt = descriptions[current];
      counter.textContent = `${current + 1} / ${pages.length}`;
      previous.disabled = current === 0;
      next.disabled = current === pages.length - 1;
      history.replaceState(null, "", `#${current + 1}`);
    }

    previous.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight" || event.key === " ") show(current + 1);
    });
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
    pages.slice(1).forEach((src) => {
      const preload = new Image();
      preload.src = src;
    });

    const requested = Number.parseInt(location.hash.slice(1), 10);
    show(Number.isFinite(requested) ? requested - 1 : 0);
  </script>
</body>
</html>
