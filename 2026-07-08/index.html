<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小柏和风铃老师的干袜子暗号</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #15120d;
      color: #fff7e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #4a3523 0, #20170f 48%, #100c08 100%);
    }
    main {
      width: min(100vw, 1180px);
      padding: 14px;
    }
    .stage {
      position: relative;
      aspect-ratio: 4 / 3;
      width: 100%;
      max-height: calc(100vh - 84px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
    }
    .page {
      position: absolute;
      inset: 0;
      display: none;
    }
    .page.active {
      display: block;
    }
    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
    }
    button {
      min-width: 96px;
      min-height: 42px;
      border: 0;
      border-radius: 8px;
      background: #fff7e5;
      color: #2a1e13;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      opacity: .45;
      cursor: default;
    }
    .count {
      color: #f2e5cb;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="小柏和风铃老师的干袜子暗号">
      <article class="page active">
        <img src="page-01.png" alt="清晨，小柏藏着湿袜子，柏爸爸递来干袜子。">
      </article>
      <article class="page">
        <img src="page-02.png" alt="小柏担心老师生气，柏爸爸把干袜子放到他手心。">
      </article>
      <article class="page">
        <img src="page-03.png" alt="小柏和柏爸爸在门口练习求助暗号。">
      </article>
      <article class="page">
        <img src="page-04.png" alt="小柏在风铃花园跑过带露水的木桥。">
      </article>
      <article class="page">
        <img src="page-05.png" alt="小柏把湿脚藏到长凳下面，犹豫要不要告诉老师。">
      </article>
      <article class="page">
        <img src="page-06.png" alt="小柏走到老师身边，说出袜子湿了请帮忙。">
      </article>
      <article class="page">
        <img src="page-07.png" alt="风铃老师拿来干袜子篮，小柏坐在小椅子上换袜子。">
      </article>
      <article class="page">
        <img src="page-08.png" alt="下午太阳热起来，小柏主动找老师帮忙擦汗。">
      </article>
      <article class="page">
        <img src="page-09.png" alt="傍晚，小柏把两次求助讲给柏爸爸听。">
      </article>
      <article class="page">
        <img src="page-10.png" alt="睡前，小柏把干袜子叠在小凳上，门口有温暖灯光。">
      </article>
    </section>
    <nav class="nav" aria-label="翻页">
      <button id="prev" type="button">上一页</button>
      <span class="count"><span id="current">1</span> / 10</span>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = Array.from(document.querySelectorAll(".page"));
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const current = document.getElementById("current");
    let index = 0;

    function render() {
      pages.forEach((page, pageIndex) => page.classList.toggle("active", pageIndex === index));
      current.textContent = String(index + 1);
      prev.disabled = index === 0;
      next.disabled = index === pages.length - 1;
    }

    prev.addEventListener("click", () => {
      index = Math.max(0, index - 1);
      render();
    });
    next.addEventListener("click", () => {
      index = Math.min(pages.length - 1, index + 1);
      render();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") prev.click();
      if (event.key === "ArrowRight" || event.key === " ") next.click();
    });
    render();
  </script>
</body>
</html>
