<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>冰里的黑色去哪儿了｜2026-11-05</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#14292e;color:#f5eee1;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}#page{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;width:auto;height:auto;min-height:0}nav{display:flex;align-items:center;justify-content:center;gap:20px;height:44px;flex-shrink:0}button{min-width:80px;height:44px;border:1px solid #7c9b9c;border-radius:12px;background:#29484d;color:inherit;font-size:18px}button:disabled{opacity:.35}#counter{min-width:70px;text-align:center;font-variant-numeric:tabular-nums}</style></head><body><main><img id="page" alt=""><nav aria-label="绘本翻页"><button id="prev" aria-label="上一页">上一页</button><span id="counter" aria-live="polite"></span><button id="next" aria-label="下一页">下一页</button></nav></main><script>const prose=["清早，小獾冬芽在门前发现一片黑黑的冰。他拉住爸爸谷川的手，停在干燥的小路上：“谁把墨水倒进水坑啦？”","谷川蹲在他身边：“只看一眼，我也不知道。我们不踩上去。回家找块冰，看看它藏了什么颜色，好吗？”冬芽把疑问装进心里。","回到家，谷川从冰箱拿出一块较透明的大冰块，放进透明浅盘。冬芽找来黑纸和白纸，挨着爸爸坐好：“先让黑纸上场！”","谷川把盘子放到黑纸上。冰块中间也暗了下来。冬芽瞪大眼睛：“它刚才还亮亮的，怎么一碰黑纸，也像沾了墨水？”","爸爸托起盘子，移到白纸上。同一块冰忽然显得亮了许多。冬芽凑近看：“墨水跑掉啦？可是，冰明明还在盘子里呀！”","冬芽想了想，把黑纸往盘子旁边推：“再换回去试试！要是下面的纸让它变黑，黑纸一回来，它也该暗下来。”爸爸点点头。","谷川托住盘子，冬芽把黑纸铺好。盘子刚放下，冰又暗了。冬芽笑得露出小牙：“真的！我们没换冰，只换了下面的纸！”","“这块冰能透过光，我们看见了下面的颜色。”爸爸说。冬芽摸摸自己的鼻子，笑了：“原来不是墨水，是黑纸躲在下面！”","冬芽把两张纸又换了一遍，亮一次，暗一次。“明早我要看看水坑下面！”爸爸握握他的手：“站在干路上看，不用踩冰找答案。”","第二天，他们又走到门前。冬芽站稳后望着黑冰：“下面也可能是深色的地面！”谷川笑了。那个黑黑的小谜团，终于露出一条线索。"];let current=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){image.src='page-'+String(current+1).padStart(2,'0')+'.png';image.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}function turn(step){current=Math.max(0,Math.min(prose.length-1,current+step));show()}prev.addEventListener('click',()=>turn(-1));next.addEventListener('click',()=>turn(1));addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)});let startX=0;image.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});image.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)turn(dx<0?1:-1)},{passive:true});show();</script></body></html>
