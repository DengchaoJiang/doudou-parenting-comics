<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>花斑小车没有不见</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f6efdf;color:#493c2d;font-family:system-ui,sans-serif;overflow:hidden}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{display:block;object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:20px}button{width:80px;height:44px;border:0;border-radius:12px;background:#e3d4b9;color:#493c2d;font-size:18px}button:disabled{opacity:.35}#counter{min-width:65px;text-align:center}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main><script>const prose=["小狐狸橙橙有一辆花斑小车，绿底上散着黄褐色斑点。爸爸岩川把一块叶子花纹的布铺在地上：“今天，这里是你的森林路。”","橙橙把小车停在布上，转身去拿玩具盒。等他回来，咦，车呢？布上绿一块、黄一块，刚才的小车好像一下子不见了。","“爸爸，它开走了吗？”橙橙趴下找。爸爸也蹲下来：“先别急着翻。你记得小车的轮子是什么样的吗？”橙橙画了一个圆圈。","布上的叶子旁，露着一个黑黑的圆圈。橙橙顺着它看，找到了车门，又找到了车头。“你在这里！”他没有掀开布，车一直停在上面。","爸爸摊开一张白纸。橙橙把车搬过去，再退后两步。这一次，绿车身和黄褐色斑点清清楚楚，他一下就看到了。","橙橙又把车放回花布，位置还是刚才那一处。车没有换，斑点也没有换，可它和周围颜色太像，边儿又变得不明显了。","“颜色和花纹跟背景相像，就可能更难被发现。这是一种伪装。”爸爸说。橙橙点点头：“原来它没消失，是我的眼睛要多找一会儿！”","收车时，一只灰褐色飞蛾落在窗外的树干上。橙橙刚看清它合拢翅膀，就得仔细找了：翅膀的颜色和斑纹，真像旁边的树皮。","橙橙把白纸铺进玩具盒底，轻轻放上花斑小车。“森林路上，你会躲；回家以后，我想很快找到你。”爸爸帮他把纸角铺平。","睡前，橙橙又打开盒盖看了一眼。小车停在白纸上，一眼就看见了。“找到你啦，晚安。”爸爸把盒子放回架子，陪他关上了灯。"];let n=0;const pic=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(i){n=Math.max(0,Math.min(9,i));pic.src='page-'+String(n+1).padStart(2,'0')+'.png';pic.alt=prose[n];counter.textContent=(n+1)+' / 10';prev.disabled=n===0;next.disabled=n===9}prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);document.onkeydown=e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)};let startX=0;pic.addEventListener('touchstart',e=>startX=e.changedTouches[0].clientX,{passive:true});pic.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)show(n+(dx<0?1:-1))},{passive:true});show(0);</script></body></html>
