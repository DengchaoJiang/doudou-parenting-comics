<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>松果桥又通了</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: #19150f;
      color: #fff8e8;
      font-family: system-ui, "Microsoft YaHei", sans-serif;
    }
    main {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 14px;
    }
    img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 36px #0009;
    }
    nav {
      min-height: calc(8vh + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: minmax(110px, 1fr) auto minmax(110px, 1fr);
      gap: 14px;
      align-items: center;
      padding: 10px 18px calc(10px + env(safe-area-inset-bottom));
      background: #19150f;
    }
    button {
      min-height: 52px;
      border: 1px solid #fff3;
      border-radius: 14px;
      background: #d9b66e;
      color: #251b0f;
      font: inherit;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
    }
    button:disabled { opacity: .35; cursor: default; }
    #next, #prev { justify-self: stretch; }
    #counter { min-width: 74px; text-align: center; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main><img id="page" src="page-01.png" alt="第1页：阿豆和弗兰一起搭松果桥。"></main>
  <nav aria-label="绘本翻页">
    <button id="prev" type="button" disabled>上一页</button>
    <span id="counter" aria-live="polite">1 / 10</span>
    <button id="next" type="button">下一页</button>
  </nav>
  <script>
    const pages = [
      "page-01.png", "page-02.png", "page-03.png", "page-04.png", "page-05.png",
      "page-06.png", "page-07.png", "page-08.png", "page-09.png", "page-10.png"
    ];
    const alts = [
      "阿豆和弗兰一起搭松果桥。",
      "阿豆在争抢蓝木牌时打了弗兰。",
      "弗兰疼得哭了，猫头鹰老师让两人停手分开。",
      "阿豆看见自己的动作给弗兰带来了疼痛和难过。",
      "阿豆道歉，弗兰说自己需要先安静一会儿。",
      "阿豆尊重弗兰的空间，没有逼他马上和好。",
      "阿豆练习收手、后退、说出需要和找老师。",
      "阿豆送来冷毛巾，在不远处安静收拾松果。",
      "弗兰还有一点难过，但愿意和阿豆重新合作。",
      "两个朋友用话语和安全动作修好了松果桥。"
    ];
    let index = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(nextIndex) {
      index = Math.max(0, Math.min(9, nextIndex));
      image.src = pages[index];
      image.alt = `第${index + 1}页：${alts[index]}`;
      counter.textContent = `${index + 1} / 10`;
      prev.disabled = index === 0;
      next.disabled = index === 9;
    }
    prev.addEventListener("click", () => show(index - 1));
    next.addEventListener("click", () => show(index + 1));
    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") show(index - 1);
      if (event.key === "ArrowRight") show(index + 1);
    });
    let touchX = null;
    document.addEventListener("touchstart", event => { touchX = event.changedTouches[0].clientX; }, { passive: true });
    document.addEventListener("touchend", event => {
      if (touchX === null) return;
      const delta = event.changedTouches[0].clientX - touchX;
      if (Math.abs(delta) > 45) show(index + (delta < 0 ? 1 : -1));
      touchX = null;
    }, { passive: true });
  </script>
</body>
</html>
