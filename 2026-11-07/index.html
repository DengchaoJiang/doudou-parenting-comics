<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>红薯小船慢慢凉｜2026-11-07</title><style>*{box-sizing:border-box}body{margin:0;background:#30251f;color:#fff;font-family:system-ui}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{height:44px;display:flex;align-items:center;gap:24px;flex-shrink:0}button{height:44px;min-width:88px;border:0;border-radius:10px;font-size:18px;color:#30251f;background:#f6d3a0}button:disabled{opacity:.35}#counter{min-width:64px;text-align:center}</style></head><body><main><img id="page" src="page-01.png" alt=""><nav><button id="prev" type="button">上一页</button><span id="counter" aria-live="polite"></span><button id="next" type="button">下一页</button></nav></main><script>const prose=["小獾麦冬把木船开进地毯港口，鼻子忽然闻到甜香。他跑到餐桌旁：“爸爸，今天的晚饭也坐船来吗？”","爸爸石松端来一只烤好的红薯，热盘放在麦冬碰不到的桌子里面。麦冬咽咽口水：“它鼓鼓的，像一艘大货船！”","爸爸用餐具剥开红薯，再轻轻分成两半，金黄的里面露出来。麦冬伸长脖子：“现在变成两艘小船啦，可以开进嘴巴了吗？”","“还不行，刚露出来的里面也很烫。”爸爸把小船放在盘里凉着。麦冬收回小爪子，嘀咕：“小船怎么还不肯到港呀？”","爸爸说：“分开以后，更多热热的地方露出来，热就更容易散到周围，慢慢凉下来。”麦冬看看红薯：“原来不是一分开就能吃！”","麦冬把自己的木船停回地毯，给它接上一座小码头。等他把最后一块积木放好，爸爸来叫：“先来吃这一小份，我检查过，已经不烫了。”","麦冬吃了一口，甜甜软软的。他指着盘里较厚的一半：“大货船也到了吧？”爸爸检查后说：“里面还热，让它再等一会儿。”","麦冬有点着急：“我想一口接一口！”爸爸给他留着大块，又分出一小份摊开凉着。麦冬捧着碗，看爸爸慢慢忙，不再伸手抓热盘。","过了一会儿，爸爸重新检查好，才把新的一份送来。麦冬用小勺轻轻挖，笑起来：“这艘船也能到我的肚子港口啦！”","晚饭后，麦冬把木船靠在爸爸脚边：“红薯船要慢慢凉，木头船要慢慢停。”爸爸笑着挪开一点脚，给这艘小船让出一个港口。"];let current=0;const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(n){current=Math.max(0,Math.min(9,n));image.src='page-'+String(current+1).padStart(2,'0')+'.png';image.alt=prose[current];counter.textContent=(current+1)+' / 10';prev.disabled=current===0;next.disabled=current===9}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});let start;image.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-start;if(Math.abs(dx)>50)show(current+(dx<0?1:-1))},{passive:true});show(0);</script></body></html>
