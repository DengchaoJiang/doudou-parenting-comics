<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07172d">
  <title>月亮慢慢跟｜2026-08-04</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #07172d;
      color: #fff8e8;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 30%, #173b66 0%, #07172d 68%); }
    main {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
    }
    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 4px 4px 8px;
    }
    #page {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 5 / 4;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, .45);
      background: #0b2340;
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      min-height: calc(8vh + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: minmax(96px, 1fr) auto minmax(96px, 1fr);
      align-items: start;
      gap: 12px;
      padding: 8px 4px max(10px, env(safe-area-inset-bottom));
    }
    button {
      min-height: 48px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      color: #fff8e8;
      font: inherit;
      font-size: 18px;
      font-weight: 650;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .35; cursor: default; }
    #previous { justify-self: end; width: min(190px, 100%); }
    #next { justify-self: start; width: min(190px, 100%); }
    #counter {
      min-width: 70px;
      padding-top: 13px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 248, 232, .82);
    }
    @media (max-height: 620px) {
      .controls { gap: 8px; }
      button { min-height: 42px; font-size: 16px; }
      #counter { padding-top: 10px; }
    }
  </style>
</head>
<body>
  <main aria-label="绘本《月亮慢慢跟》">
    <section class="stage">
      <img id="page" src="page-01.png" alt="《月亮慢慢跟》第 1 页" draggable="false">
    </section>
    <nav class="controls" aria-label="翻页控制">
      <button id="previous" type="button" aria-label="上一页">上一页</button>
      <span id="counter" aria-live="polite">1 / 10</span>
      <button id="next" type="button" aria-label="下一页">下一页</button>
    </nav>
  </main>
  <script>
    const pages = Array.from({ length: 10 }, (_, index) => `page-${String(index + 1).padStart(2, "0")}.png`);
    const image = document.querySelector("#page");
    const previous = document.querySelector("#previous");
    const next = document.querySelector("#next");
    const counter = document.querySelector("#counter");
    let current = 0;

    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current];
      image.alt = `《月亮慢慢跟》第 ${current + 1} 页`;
      counter.textContent = `${current + 1} / ${pages.length}`;
      previous.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }

    previous.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight" || event.key === " ") show(current + 1);
    });
    let touchStartX = null;
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 48) show(current + (delta < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });
    show(0);
  </script>
</body>
</html>
