<script>const prose=["滚筒车慢慢来\n小狐狸小满回到家，脑袋里还轰隆隆响着修路车的声音。他把蓝色翻斗车排到桌边，问青柏爸爸：“路上那辆滚筒车，为什么长得那么大？”","爸爸正在洗最后一只碗。“这只洗好，我就来听你的工程计划。”小满把黄色玩具滚筒车也找出来，给爸爸留了一个位置。水声停了，爸爸擦干手，真的坐到了他身边。","他们在浅浅的托盘里倒进一点干净的微湿游戏沙。小满开着蓝色翻斗车卸下沙，拿小铲子铺成一条路。“送货啦！”他推来一辆装着积木的小货车。车轮刚进去，就陷出两道深印，车头歪到一旁。","“快走呀！”小满又推了一下，轮子挖出更深的坑。“它是不是卡住了？”爸爸没有急着换车，伸手扶住车头：“货车着急了。我们先看看脚下的路呢？”","小满用铲背轻轻碰了碰路面，松沙簌簌往旁边落。“它还没站稳。”他把货车请到托盘边，又把黄色滚筒车开了过来：“现在轮到你，慢慢来。”","爸爸扶住托盘，小满轻轻推着滚筒，从一头走到另一头。滚筒后面留下平平的一条。他们把同一辆小货车放上去，轻轻一推，这次轮子没有陷得那么深。","“咦，这里跟刚才不一样！”小满又把车推到没压过的松沙上，轮子沉了下去。他看看两边：“原来不是车不肯走，是路还松松的。”","“沙粒之间有空隙，压一压，沙粒挤紧些。”爸爸用手掌做了个轻轻合拢的动作，“真正的压路机，也要把合适的路料压密实。它长得大，可不是为了跑第一。”","小满让翻斗车继续运料，让滚筒车慢慢跟上。碰到一处凸起，他停下来，用铲子铺匀，再请滚筒走一遍。“货车别急，这一小段还没有准备好。”","终于，小货车沿着整好的路，把积木送到了托盘另一端。小满弯下眼睛笑了：“小路准备好了，货物也到家了！”","他还想接着修，托盘外却已经落了几粒沙。爸爸指指留下的路：“我们先把这里收好，这段路可以留到下次。”小满把货车停在路边，和爸爸一起收起散沙、洗净手。黄色滚筒车安静下来，小满靠着爸爸，小声说：“明天再慢慢来。”"];let current=0;const pic=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');function show(n){current=Math.max(0,Math.min(prose.length-1,n));pic.src='page-'+String(current+1).padStart(2,'0')+'.png';pic.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});show(0);</script></body></html>
