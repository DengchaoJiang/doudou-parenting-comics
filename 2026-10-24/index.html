<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小路先睡一会儿</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#f0e9db;color:#403c34;font-family:system-ui}main{height:100dvh;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}#page{width:100%;height:calc(100% - 52px);min-height:0;object-fit:contain}nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:20px}button{font:inherit;background:#fff9ee;border:1px solid #95846d;border-radius:10px;min-width:76px;height:42px;cursor:pointer}button:disabled{opacity:.4}#counter{min-width:55px;text-align:center}</style></head>
<body><main><img id="page" alt=""><nav aria-label="绘本翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main>
<script>const prose=["小路先睡一会儿\n圆圆想给爸爸做一条彩珠小路。红珠像苹果，黄珠像太阳，蓝珠像雨后的小水洼。他把短绳铺在托盘里，穿上三颗大珠，举起来给爸爸看。","哗啦！绳子的一头垂下去，彩珠滑进托盘，刚排好的小路一下散开了。圆圆捏着空绳，嘴巴扁了：“它们为什么不等我？”","他重新穿好，又急着举起来。蓝珠带着黄珠滑走了。圆圆把绳子推开：“我不会！爸爸，你全部帮我做好吧。”眼泪落在他的鼻尖。","松原爸爸坐到旁边，没有把整盘拿走。“你很喜欢刚才的小路，散了真可惜。我陪你看看，它们是从哪里出去的。”圆圆指了指垂下的绳头。","爸爸把短绳放回托盘，只留一颗大珠。他们一起抬高一端，珠子朝低处滑，滑到了没有挡住的绳头。“原来，这里有个出口！”圆圆说。","“地球的重力让东西往下落。”爸爸说，“这颗珠子能沿着斜绳往低处滑，到了没挡住的末端，就掉下来了。不是你不够用心。”","圆圆捏住绳头：“我当小门！”可他想拿下一颗珠子，手一松，小门又开了。他着急地看爸爸：“我的手不够用了。”","“这一头交给我。”爸爸用大夹子牢牢夹住绳端，检查不会松，再扶住另一头。圆圆重新穿进一颗蓝珠。这次珠子到了夹子前，停住了。","圆圆穿好红珠，轻轻拉起一点短绳。两颗珠子仍留在绳上。他笑了，手却有点累了：“小路还没做完呢。”爸爸说：“没做完，也可以先休息。”","他们把大珠和短绳放进作品盒，爸爸合好盒盖，收上高处。圆圆摸摸盒子：“小路先睡一会儿。”爸爸伸出手：“等你想做了，我再来守住这一头。”圆圆牵住他，安心去休息了。"];let current=0;const page=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){page.src='page-'+String(current+1).padStart(2,'0')+'.png';page.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}prev.onclick=()=>{if(current>0){current--;show()}};next.onclick=()=>{if(current<prose.length-1){current++;show()}};document.onkeydown=e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()};show();</script></body></html>
