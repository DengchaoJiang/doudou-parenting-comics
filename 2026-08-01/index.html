<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20150f">
  <title>红果子，先停一下</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #20150f;
      color: #fff7e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      touch-action: pan-y;
    }
    main {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }
    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 12px 44px rgb(0 0 0 / 45%);
      user-select: none;
      -webkit-user-drag: none;
    }
    button {
      position: absolute;
      top: 50%;
      translate: 0 -50%;
      width: 54px;
      height: 76px;
      border: 0;
      border-radius: 14px;
      background: rgb(32 21 15 / 68%);
      color: #fff7e8;
      font-size: 34px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button:disabled { opacity: 0.22; cursor: default; }
    #prev { left: max(14px, env(safe-area-inset-left)); }
    #next { right: max(14px, env(safe-area-inset-right)); }
    #counter {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      min-width: 58px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgb(32 21 15 / 72%);
      text-align: center;
      font-size: 14px;
      line-height: 1;
    }
    @media (max-width: 760px) {
      button { width: 44px; height: 64px; font-size: 28px; }
    }
  </style>
</head>
<body>
  <main aria-label="《红果子，先停一下》绘本阅读器">
    <img id="page" src="page-01.png" alt="">
    <button id="prev" type="button" aria-label="上一页">‹</button>
    <button id="next" type="button" aria-label="下一页">›</button>
    <div id="counter" aria-live="polite">1 / 10</div>
  </main>
  <script>
    const pages = [
      "page-01.png",
      "page-02.png",
      "page-03.png",
      "page-04.png",
      "page-05.png",
      "page-06.png",
      "page-07.png",
      "page-08.png",
      "page-09.png",
      "page-10.png"
    ];
    const descriptions = [
      "夏末的早晨，栗团和松爸爸来到浆果园。木牌画着两只小篮子：蓝莓走左边，覆盆子走右边。",
      "栗团把成熟的覆盆子轻轻放进篮子，又跑到蓝莓丛旁，专找圆滚滚的大果子。",
      "小路尽头，一颗亮红果子从篱笆外探出头，红得像一粒小灯珠。栗团好奇地伸出了手。",
      "松爸爸轻轻托住他的手腕，温和地说：先停一下，我们不认识这棵植物。栗团缩回手，皱起了眉。",
      "栗团问：它又红又圆，为什么不能摘？松爸爸说：颜色只是线索，不是答案。我们可以拍照，或者请园丁确认。",
      "栗团选了拍照。他们只用眼睛看：叶子的边缘、果子连着的枝条，还有它生长的位置。",
      "他们回到入口，把照片拿给苔伯伯看。苔伯伯摇摇头：一张照片还不够，没认准就不摘。",
      "栗团有一点失望。松爸爸说：好奇心没有关掉，我们只是给它装了一个暂停钮。",
      "在挂着采摘标志的覆盆子行，栗团先问：这颗确认过了吗？两个大人一起点头，他才轻轻摘下。",
      "回家路上，栗团拍拍装着照片的小蓝布包：眼睛看，手先停，请大人确认。篱笆后的红果还在枝头摇呀摇。"
    ];
    const image = document.querySelector("#page");
    const previous = document.querySelector("#prev");
    const next = document.querySelector("#next");
    const counter = document.querySelector("#counter");
    let current = 0;
    let touchStartX = 0;

    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current];
      image.alt = descriptions[current];
      counter.textContent = `${current + 1} / ${pages.length}`;
      previous.disabled = current === 0;
      next.disabled = current === pages.length - 1;
      history.replaceState(null, "", `#${current + 1}`);
    }

    previous.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight" || event.key === " ") show(current + 1);
    });
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
    pages.slice(1).forEach((src) => {
      const preload = new Image();
      preload.src = src;
    });

    const requested = Number.parseInt(location.hash.slice(1), 10);
    show(Number.isFinite(requested) ? requested - 1 : 0);
  </script>
</body>
</html>
