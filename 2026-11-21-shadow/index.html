<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>谁把影子拉长了</title><style>*{box-sizing:border-box}body{margin:0;background:#253b42;color:#fff;font:18px system-ui}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 8px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-width:100%;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 60px)}nav{display:flex;align-items:center;gap:14px;height:44px;flex-shrink:0}button{border:0;border-radius:8px;min-height:44px;padding:0 12px;background:#f8dfa9;color:#253b42;font:inherit}button:disabled{opacity:.5}a{color:#f8dfa9}</style><body><main><img id="page" src="page-01.webp" alt=""><nav aria-label="绘本翻页"><a href="../">首页</a><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main><script>const images=["page-01.webp","page-02.webp","page-03.webp","page-04.webp","page-05.webp","page-06.webp","page-07.webp","page-08.webp","page-09.webp","page-10.webp"],story=["午饭后，小象云团要给院子里的花画一把伞。他刚打开画本，就发现脚边的影子短短的，连长鼻子也缩成了一团。","傍晚，云团回来给花浇水，差点踩到地上的一条黑路。他一抬鼻子，黑路也跟着动。原来是他的影子变长了。","云团跑去找爸爸槐舟，把脚后跟放回午后站过的石缝边。他伸直腿说：“你看，我没长高呀！”","槐舟看了看地上的影子，找来一块木板、一只木象和一盏小灯。“把刚才的光请回来试试。”他说。","他们在桌边坐下，木象站在木板中央。槐舟把亮着的小灯举高，云团往木板上一看，影子缩在木象身边。","云团扶住木板，木象的脚一步也没挪。爸爸把小灯降下来，从侧面照过去，木象鼻子的影子一下伸到了木板边。","“它的鼻子也没有长呀！”云团笑起来。他看着小灯的位置，终于明白，灯照得越斜，木象的影子就越长。","他们回到院子。夕阳从矮墙那边斜斜照来，影子一直伸到花盆脚边。云团认出了刚才在木板上看到的一幕。","他合上浇水壶的盖子，拿起刚才的画本。他画一只小象站在夕阳里，再画一只长鼻子的影子。","槐舟把画夹到窗旁。云团举起鼻子当作挥手，地上的长鼻子也举了起来。今晚，他给画添上一位没有颜色的朋友。"];const page=document.querySelector("#page"),prev=document.querySelector("#prev"),next=document.querySelector("#next"),counter=document.querySelector("#counter");let i=0,start;function show(n){i=Math.min(images.length-1,Math.max(0,n));page.src=images[i];page.alt=story[i];counter.textContent=(i+1)+" / "+images.length;prev.disabled=i===0;next.disabled=i===images.length-1}prev.onclick=()=>show(i-1);next.onclick=()=>show(i+1);document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(i+1);if(e.key==="ArrowLeft")show(i-1)});page.addEventListener("touchstart",e=>start=e.changedTouches[0].clientX,{passive:true});page.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-start;if(Math.abs(d)>45)show(i+(d<0?1:-1))},{passive:true});show(0)</script></body></html>
