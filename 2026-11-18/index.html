<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>2026-11-18 科普绘本《小瓶子去了哪里》</title><style>*{box-sizing:border-box}body{margin:0;background:#203531;color:#fff;font:18px system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 12px calc(8vh + env(safe-area-inset-bottom))}img{object-fit:contain;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 64px);max-width:100%;height:auto;width:auto;min-height:0}nav{height:44px;display:flex;align-items:center;gap:20px;flex-shrink:0}button{font:inherit;min-width:88px;min-height:44px;border:0;border-radius:8px;background:#f3dda7;color:#203531}button:disabled{opacity:.35}a{color:#f3dda7;text-decoration:none}#counter{min-width:60px;text-align:center}@media(max-width:550px){nav{gap:10px;font-size:15px}button{min-width:64px}}</style></head><body><main><img id="page" src="page-01.png" alt="傍晚，小浣熊冬冬提着空瓶袋，跟爸爸柏舟走进商店。袋子沙啦沙啦响，像藏着一支小乐队。冬冬把一只空塑料瓶送进了还瓶机。"><nav aria-label="绘本翻页"><a href="../" aria-label="返回绘本首页">首页</a><button id="prev" disabled>上一页</button><span id="counter" aria-live="polite">1 / 10</span><button id="next">下一页</button></nav></main><script>const pages=[{"src":"page-01.png","alt":"傍晚，小浣熊冬冬提着空瓶袋，跟爸爸柏舟走进商店。袋子沙啦沙啦响，像藏着一支小乐队。冬冬把一只空塑料瓶送进了还瓶机。"},{"src":"page-02.png","alt":"小瓶子慢慢滑进去，绿灯亮了一下，它就不见了。冬冬踮起脚，只看见黑黑的洞口。“爸爸，它到哪儿去了？里面住着收瓶子的小怪兽吗？”"},{"src":"page-03.png","alt":"机器深处传来咔嚓声，冬冬的耳朵立起来了。“它是不是把瓶子咬碎了？”柏舟蹲到他身边：“里面怎么工作，我也没看见。我们一起找找答案。”"},{"src":"page-04.png","alt":"又还了一只瓶子，他们让到旁边，把洞口留给下一位。柏舟在手机上找到还瓶机的说明图。冬冬把小爪子放在屏幕外边，沿着图里的小路，开始追赶那只瓶子。"},{"src":"page-05.png","alt":"图里的小瓶子先经过一圈感应器，再坐上传送带。“它怎么知道这是瓶子？”冬冬问。柏舟放大图片：“它会识别条码，也会检查瓶子的形状。”"},{"src":"page-06.png","alt":"传送带接着分了路：塑料瓶走一条路，金属罐走另一条路。冬冬用两只爪子比出岔路：“原来它们不是一股脑儿挤在一起呀！”"},{"src":"page-07.png","alt":"翻到下一张，冬冬看见塑料瓶被压扁了，身子皱巴巴的。他摸摸袋里最后那只圆鼓鼓的瓶子，小声问：“变成这么扁，还能做什么呢？”"},{"src":"page-08.png","alt":"柏舟指着图里的收集箱：“压扁后占的地方小，同样大的箱子能装下更多。”冬冬把爪子收拢，又张开：“小瓶子挤一挤，就给伙伴腾出位置了！”"},{"src":"page-09.png","alt":"“然后呢？”冬冬还想追下去。柏舟指给他看，收走的瓶子会送去回收处理，材料还能用来做新东西。原来，咔嚓声后面，还有那么长的一段路。"},{"src":"page-10.png","alt":"冬冬回到机器前，送进去最后一只瓶子。这次听见咔嚓声，他没有找小怪兽，而是轻轻挥了挥爪子：“再见啦！”空袋子沙啦一响，爸爸牵住了他的手。"}],image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');let n=0;function show(i){n=Math.max(0,Math.min(pages.length-1,i));image.src=pages[n].src;image.alt=pages[n].alt;counter.textContent=(n+1)+' / '+pages.length;prev.disabled=n===0;next.disabled=n===pages.length-1;}prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1);});let sx;image.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)show(n+(dx<0?1:-1));},{passive:true});</script></body></html>
