<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>高高的愿望，稳稳的脚</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#302c27;color:#fff;font-family:system-ui}
main{height:100dvh;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}
#page{display:block;width:100%;height:calc(100% - 52px);min-height:0;object-fit:contain}
nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:24px}button{min-width:78px;height:44px;border:0;border-radius:12px;font-size:17px;background:#f1d7ad}button:disabled{opacity:.35}
</style>
<main><img id="page" alt=""><nav><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main>
<script>
const prose=["《高高的愿望，稳稳的脚》小河狸木木在地毯上摆好一棵纸树，又拿出一颗蓝星星。在他的游戏里，树梢高得像云。木木拍拍黄色小车：“今天，你送星星上去。”","他在窄窄的车身上，一块一块叠起蓝积木，最上面安好黄色篮子。“还要高一点！”木木伸长脖子看，蓝星星还躺在树旁，等着出发。","可是，他的爪子刚松开，车身就向旁边一歪。哗啦，蓝积木倒了一地，篮子滚到脚边。木木捡起来，耳朵垂了下去：“我好不容易才搭这么高。”","石川爸爸坐到他身旁：“你想够到树梢，不想把它改矮，是吗？”木木点点头。爸爸没有替他拆车，只扶住车身：“那我们看看，它下面怎么站。”","木木站起来，先把脚并拢，又慢慢分开。爸爸牵着他的爪子，让他站稳。木木忽然低头看看自己，再看看小车：“它也可以把脚伸开呀！”","他从积木筐里找出绿积木，在车身两边各拼一只支脚。两只脚向外伸，脚底稳稳碰到地毯。“不是只把上面变大，下面也要帮忙站住。”","“你扶一下，我来搭。”木木请爸爸稳住车身，把原来的蓝积木重新叠上去。黄色篮子又回到高处。树还是那棵树，他想要的高度也留住了。","爸爸慢慢松开爪子。木木轻轻碰了碰篮子边，这次小车没有倒。“比刚才稳多了！”他笑起来。爸爸点点头：“支脚帮着撑住了，不过还是要轻轻玩。”","木木把蓝星星放进高高的篮子，又从篮子里拿出来，挂到纸树顶上。“送到了！”他绕着小车看了一圈，没有再去碰它，只挨着爸爸坐下来。","蓝星星在树梢安安静静地挂着。木木把爪子放进爸爸掌心：“我没把高高的愿望拆掉。”爸爸轻轻握住他：“嗯，你给它找到了稳稳的脚。”"];let current=1;
const image=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
function show(){image.src='page-'+String(current).padStart(2,'0')+'.png';image.alt=prose[current-1];document.querySelector('#counter').textContent=current+' / 10';prev.disabled=current===1;next.disabled=current===10}
prev.onclick=()=>{if(current>1){current--;show()}};next.onclick=()=>{if(current<10){current++;show()}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});show();
</script></html>
