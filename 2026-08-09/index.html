<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171d14">
  <title>2026-08-09 科普绘本《路牌只说往哪边》</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #171d14;
      color: #f6eedb;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: radial-gradient(circle at 50% 35%, #34402d 0, #171d14 72%); }
    .reader { position: fixed; inset: 0; min-height: 0; }
    .topbar {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      right: max(14px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 2;
      color: #e6ddc7;
      font-size: clamp(13px, 1.8vw, 18px);
    }
    .home { color: inherit; text-decoration: none; padding: 8px 10px; }
    .counter { min-width: 5.5em; text-align: right; font-variant-numeric: tabular-nums; }
    .stage {
      position: absolute;
      top: calc(max(10px, env(safe-area-inset-top)) + 48px);
      left: max(12px, env(safe-area-inset-left));
      right: max(12px, env(safe-area-inset-right));
      bottom: calc(82px + 8vh + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .stage img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .38);
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      right: max(18px, env(safe-area-inset-right));
      bottom: calc(2vh + env(safe-area-inset-bottom));
      height: 64px;
      display: flex;
      justify-content: center;
      gap: clamp(18px, 8vw, 88px);
      z-index: 2;
    }
    button {
      min-width: clamp(120px, 22vw, 220px);
      min-height: 56px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      background: rgba(53, 66, 43, .94);
      color: #fff9ec;
      font: inherit;
      font-size: clamp(18px, 2.3vw, 24px);
      cursor: pointer;
      touch-action: manipulation;
    }
    button:disabled { opacity: .35; }
    button:active:not(:disabled) { transform: scale(.98); }
    @media (max-height: 540px) {
      .topbar { font-size: 13px; }
      .stage { top: 42px; bottom: calc(66px + 8vh + env(safe-area-inset-bottom)); }
      .controls { height: 52px; }
      button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="reader" aria-label="绘本阅读器">
    <header class="topbar">
      <a class="home" href="../" aria-label="返回绘本目录">‹ 绘本目录</a>
      <span class="counter" id="counter" aria-live="polite">第 1 / 10 页</span>
    </header>
    <section class="stage" id="stage">
      <img id="page" src="page-01.png" alt="栗果农场的风把草吹得一浪一浪。小獾野野记得，上次谷仓旁停着一辆蓝色独轮车。">
    </section>
    <nav class="controls" aria-label="翻页">
      <button id="prev" type="button" disabled>上一页</button>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = [
      ["page-01.png", "栗果农场的风把草吹得一浪一浪。小獾野野记得，上次谷仓旁停着一辆蓝色独轮车。"],
      ["page-02.png", "可是今天，谷仓边只剩一块浅浅的车轮印。野野问：蓝车去哪儿了？榆爸爸说：我们先找线索。"],
      ["page-03.png", "木路牌的箭头指向榛子林。野野眼睛一亮：独轮车一定在那里！爸爸说：路牌只告诉我们往哪边。"],
      ["page-04.png", "他们沿着箭头走，数过三块扁石头，又绕过一截倒木。脚下的路，慢慢变窄了。"],
      ["page-05.png", "榛子枝咔嗒、咔嗒地轻敲。野野停住了：这里黑黑的，我有点害怕。"],
      ["page-06.png", "榆爸爸摊开手：害怕是在提醒你慢一点。我们可以牵手走三步，也可以现在回头。"],
      ["page-07.png", "野野握住爸爸的手，走了一步、两步、三步。前面还是密密的树影，也没有蓝车。"],
      ["page-08.png", "我想回去，不是因为我输了。野野说。榆爸爸点点头：会停下来，也是会找路。"],
      ["page-09.png", "走出林口，野野画下走过的路。爸爸在问号旁画了一只耳朵：下次，我们可以问工作人员。"],
      ["page-10.png", "野野没有再追进树林。他笑着说：路牌只说往哪边，今天的我，也知道什么时候往回走。"]
    ];
    let current = 0;
    const image = document.getElementById("page");
    const counter = document.getElementById("counter");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current][0];
      image.alt = pages[current][1];
      counter.textContent = `第 ${current + 1} / ${pages.length} 页`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }
    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
    });
    let touchStartX = 0;
    document.getElementById("stage").addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.getElementById("stage").addEventListener("touchend", (event) => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) < 45) return;
      show(current + (delta < 0 ? 1 : -1));
    }, { passive: true });
  </script>
</body>
</html>
