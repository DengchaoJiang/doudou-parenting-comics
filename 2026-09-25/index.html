<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>连不上的红车厢</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#18140f;color:#fff7e6;overflow:hidden}
main{height:100vh;display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage{display:grid;place-items:center;min-height:0;overflow:hidden;padding:12px 16px calc(8vh + env(safe-area-inset-bottom))}
.page{display:none;max-width:100%;max-height:calc(92vh - 88px);width:auto;height:auto;object-fit:contain;border-radius:10px}
.page.active{display:block}
nav{min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 16px max(8px,env(safe-area-inset-bottom))}
button{min-height:44px;padding:0 18px;border:1px solid #796343;border-radius:10px;background:#31291e;color:inherit;font:inherit}
button:disabled{opacity:.35}
.count{min-width:64px;text-align:center}
</style>
</head>
<body>
<main>
<section class="stage" aria-live="polite">
<img class="page active" src="page-01.png" alt="封面：连不上的红车厢">
<img class="page" src="page-02.png" alt="故事第1页">
<img class="page" src="page-03.png" alt="故事第2页">
<img class="page" src="page-04.png" alt="故事第3页">
<img class="page" src="page-05.png" alt="故事第4页">
<img class="page" src="page-06.png" alt="故事第5页">
<img class="page" src="page-07.png" alt="故事第6页">
<img class="page" src="page-08.png" alt="故事第7页">
<img class="page" src="page-09.png" alt="故事第8页">
<img class="page" src="page-10.png" alt="故事第9页">
<img class="page" src="page-11.png" alt="故事第10页">
</section>
<nav aria-label="翻页"><button id="prev">上一页</button><span class="count" id="count">1 / 11</span><button id="next">下一页</button></nav>
</main>
<script>
const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),count=document.querySelector('#count');
let current=0;
function show(index){current=Math.max(0,Math.min(pages.length-1,index));pages.forEach((p,i)=>p.classList.toggle('active',i===current));count.textContent=(current+1)+' / '+pages.length;prev.disabled=current===0;next.disabled=current===pages.length-1}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight'||e.key===' ')show(current+1)});
let startX=null;
document.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(startX===null)return;const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)show(current+(d<0?1:-1));startX=null},{passive:true});
show(0);
</script>
</body>
</html>
