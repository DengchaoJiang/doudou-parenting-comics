<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>雪花搬进小碟子｜2026-11-12</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#172c35;color:#fff}body{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));gap:8px;font-family:system-ui,sans-serif;overflow:hidden}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}nav{flex:none;min-height:48px;display:flex;align-items:center;justify-content:center;gap:20px}button{font:inherit;font-size:18px;min-height:46px;min-width:100px;padding:8px 18px;color:#172c35;background:#f7e9c9;border:0;border-radius:12px;cursor:pointer}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #fff;outline-offset:3px}output{min-width:70px;text-align:center;font-variant-numeric:tabular-nums;font-size:18px}@media(max-height:500px){body{padding-top:4px;gap:4px}nav{min-height:40px}button{min-height:40px;padding:4px 12px}}</style></head><body>
<main id="reader" aria-label="雪花搬进小碟子，十页绘本"><img id="page" src="page-01.webp" alt="早晨，小獾墨墨推开门，白白的雪花落在他的黄围巾上。他伸出手套接住一片，赶紧喊爸爸：“快看，天空掉下小羽毛啦！”" draggable="false"></main>
<nav aria-label="绘本翻页"><button id="prev" type="button">上一页</button><output id="count" aria-live="polite">1 / 10</output><button id="next" type="button">下一页</button></nav>
<script>const prose=["早晨，小獾墨墨推开门，白白的雪花落在他的黄围巾上。他伸出手套接住一片，赶紧喊爸爸：“快看，天空掉下小羽毛啦！”","台阶边也落了雪，可墨墨刚蹲下来，那点白色就瘦了，地上多了一滴亮亮的水。“它跑到哪里去了？”墨墨趴低了找。","爸爸拿来一只蓝边小碟子，陪墨墨接了一小堆干净的雪。墨墨捧着碟子进屋：“这回有小围墙，看你往哪里跑！”","屋里暖和，墨墨摘下围巾，把碟子放在桌上。可雪堆还是一点点矮下去，碟子边上慢慢围起一圈水，像一条小河。","墨墨举起碟子看看底下，没有洞，桌子也没湿。爸爸凑过来：“雪没有漏掉。它在暖和的地方，正在融化成水呢。”","墨墨还想看个明白。爸爸又取来一只同样的碟子，陪他装上差不多多的雪。一碟留在屋里，一碟放在寒冷的门外。","墨墨趴在窗边等，鼻尖快贴上玻璃。屋里的雪先塌了一个小角；门外那堆雪还白白地蹲着，像一顶没睡醒的小帽子。","过了一会儿，屋里的小帽子全变成了水。墨墨看看门外，又看看桌上：“原来暖和的屋子，让这一碟雪先变了样！”","爸爸把门外的碟子端进屋，墨墨给它腾出一个位置。两个人一起等着，白雪慢慢变矮，透明的水又在碟子里亮了起来。","墨墨把两只小碟子并排摆好，笑着对爸爸说：“我找到雪啦，它变成水，还在这里！”窗外又飘来雪花，他拉着爸爸去看。"];let current=0;const pic=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');function show(n){current=Math.max(0,Math.min(prose.length-1,n));pic.src='page-'+String(current+1).padStart(2,'0')+'.webp';pic.alt=prose[current];count.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1;if(current<prose.length-1){const preload=new Image();preload.src='page-'+String(current+2).padStart(2,'0')+'.webp'}}prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});let startX=null;const reader=document.getElementById('reader');reader.addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX},{passive:true});reader.addEventListener('touchend',e=>{if(startX===null)return;const delta=e.changedTouches[0].screenX-startX;if(Math.abs(delta)>60)show(current+(delta<0?1:-1));startX=null},{passive:true});show(0);</script></body></html>
