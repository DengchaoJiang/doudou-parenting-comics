<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183b35"><title>小海狸咚咚找水珠｜2026-11-11</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#183b35;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}button{font:inherit;touch-action:manipulation}#reader{height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;padding:12px max(12px,env(safe-area-inset-right)) calc(8vh + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.frame{position:relative;flex:1;min-height:0;min-width:0;touch-action:pan-y;user-select:none}.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:8px}.controls{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,70px);flex:none;min-height:48px}.controls button{border:1px solid #bacdc3;background:#f4e8cf;color:#173b35;padding:10px 24px;border-radius:26px;min-height:46px;min-width:112px;cursor:pointer}.controls button:disabled{opacity:.4;cursor:default}#counter{font-variant-numeric:tabular-nums;min-width:65px;text-align:center}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-height:500px){#reader{padding-top:6px;gap:5px}.controls{min-height:40px}.controls button{min-height:38px;padding:6px 20px}}
</style></head><body><main id="reader" aria-label="小海狸咚咚找水珠，十页绘本"><div class="frame" id="frame"><img id="page" alt="" draggable="false"></div><nav class="controls" aria-label="绘本翻页"><button id="prev" type="button">上一页</button><span id="counter" role="status" aria-live="polite"></span><button id="next" type="button">下一页</button></nav></main><script>
const pages=[{"src":"page-01.webp","text":"小海狸咚咚把小货车停在洗衣房门外。爸爸正在洗蓝毛巾，圆窗里的毛巾翻个跟头，又翻个跟头。"},{"src":"page-02.webp","text":"忽然，滚筒转快了，蓝毛巾贴在里面转圈。咚咚站在爸爸身旁，睁大眼睛问：“水呢？水被藏到哪里去了？”"},{"src":"page-03.webp","text":"爸爸指指机器后面的排水管：“水有自己的小路。”咚咚听见咕噜咕噜的声音，仿佛听见一颗小水珠在说话。"},{"src":"page-04.webp","text":"那颗小水珠叫滴答，原先躲在蓝毛巾里。滚筒飞快地转，滴答被甩了出来：“哎呀，我要换一条路走啦！”"},{"src":"page-05.webp","text":"筒壁上有许多小孔。滴答穿过一个小孔，回头一看，蓝毛巾还留在滚筒里，像一面绕圈圈的小旗子。"},{"src":"page-06.webp","text":"小孔外面还有一层接水的桶。滴答落到下面，和别的小水珠汇在一起：“这儿也没有漏到地板上呀！”"},{"src":"page-07.webp","text":"排水泵嗡嗡工作，把水送进排水管。滴答跟着伙伴们拐过弯，咕噜一声钻进去，像坐上了一辆水珠小火车。"},{"src":"page-08.webp","text":"小火车沿着排水管，驶向下水道。咚咚听着那阵咕噜声，小声说：“原来水没有消失，它从另一条路走了。”"},{"src":"page-09.webp","text":"终于，滚筒停稳，门锁打开了。爸爸取出蓝毛巾，咚咚摸了摸：“还潮潮的呢！小水珠没有全都出发。”"},{"src":"page-10.webp","text":"爸爸和咚咚把毛巾挂起来，剩下的水还要慢慢晾干。咚咚跑回小货车旁：“我也要出发啦，毛巾在这里等风！”"}];
let current=0;
const img=document.getElementById('page'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),frame=document.getElementById('frame');
function show(n){current=Math.max(0,Math.min(pages.length-1,n));img.src=pages[current].src;img.alt=pages[current].text;counter.textContent=(current+1)+' / '+pages.length;prev.disabled=current===0;next.disabled=current===pages.length-1;if(current+1<pages.length){const p=new Image();p.src=pages[current+1].src}}
prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});
let startX=0,startY=0,swiped=false;frame.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY;swiped=false},{passive:true});frame.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){swiped=true;show(current+(dx<0?1:-1));setTimeout(()=>swiped=false,350)}},{passive:true});
frame.addEventListener('click',e=>{if(swiped)return;let r=frame.getBoundingClientRect();if(e.clientX-r.left<r.width*.35)show(current-1);else if(e.clientX-r.left>r.width*.65)show(current+1)});
show(0);
</script></body></html>
