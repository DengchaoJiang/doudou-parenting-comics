<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251f">
  <title>橘帽船漂过蓝石头</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: #17251f;
      color: #fff;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      touch-action: pan-y;
    }
    .stage {
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 14px calc(8vh + env(safe-area-inset-bottom));
    }
    #page {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.38);
      user-select: none;
      -webkit-user-drag: none;
    }
    .controls {
      min-height: 68px;
      display: grid;
      grid-template-columns: minmax(96px, 1fr) auto minmax(96px, 1fr);
      align-items: center;
      gap: 14px;
      padding: 8px max(16px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      background: rgba(10, 18, 15, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 14px;
      background: #f2c45d;
      color: #1f271f;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.35; cursor: default; }
    #counter { min-width: 64px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; }
    @media (max-height: 640px) {
      .stage { padding-top: 8px; padding-bottom: calc(7vh + env(safe-area-inset-bottom)); }
      .controls { min-height: 58px; }
      button { min-height: 42px; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-live="polite">
    <img id="page" src="page-01.png" alt="雨停了，栗尾抱着橘帽船，和松爸爸来到亮闪闪的湖边。湿木头闻起来像新削开的铅笔。">
  </main>
  <nav class="controls" aria-label="翻页">
    <button id="prev" type="button" disabled>上一页</button>
    <span id="counter" aria-label="页码">1 / 10</span>
    <button id="next" type="button">下一页</button>
  </nav>
  <script>
    const pages = [
      ["page-01.png", "雨停了，栗尾抱着橘帽船，和松爸爸来到亮闪闪的湖边。湿木头闻起来像新削开的铅笔。"],
      ["page-02.png", "他在浅水里放船，船绕着三块蓝石头打转。松爸爸就在一步外，影子和栗尾挨在一起。"],
      ["page-03.png", "一阵风钻过芦苇，橘帽船忽然越过蓝石头，朝深水滑去。栗尾的脚尖也跟着向前挪。"],
      ["page-04.png", "他看见水色变深，马上停住：船过去了，我不过去。爸爸，请帮忙！"],
      ["page-05.png", "松爸爸蹲下来抱了抱他：喜欢的船漂远了，当然会难过。人留在岸上，比船回来更重要。"],
      ["page-06.png", "爸爸拿来长柄网，可湖水轻轻一推，船又溜远了一点。栗尾攥着爸爸的衣角，没有跨过蓝石头。"],
      ["page-07.png", "如果它不回来呢？栗尾小声问。松爸爸说：那就让它去旅行，我们可以再折一艘。"],
      ["page-08.png", "栗尾鼻子酸酸的，向远处挥手：橘帽船，记得看路！这时一圈小浪把船慢慢送回浅湾。"],
      ["page-09.png", "栗尾没有扑过去，只指着船喊：它回到蓝石头里面啦！松爸爸站稳后，用网把湿船捞起。"],
      ["page-10.png", "回家后，栗尾在纸湖边画了三块蓝石头。他告诉玩具小狐狸：东西漂远可以告别，人不能追进深水。"]
    ];
    const image = document.querySelector("#page");
    const counter = document.querySelector("#counter");
    const prev = document.querySelector("#prev");
    const next = document.querySelector("#next");
    let current = 0;
    let touchStartX = null;

    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current][0];
      image.alt = pages[current][1];
      counter.textContent = `${current + 1} / ${pages.length}`;
      prev.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }

    prev.addEventListener("click", () => show(current - 1));
    next.addEventListener("click", () => show(current + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") show(current - 1);
      if (event.key === "ArrowRight") show(current + 1);
    });
    document.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });
    document.addEventListener("touchend", (event) => {
      if (touchStartX === null) return;
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 45) show(current + (delta < 0 ? 1 : -1));
      touchStartX = null;
    }, { passive: true });
  </script>
</body>
</html>
