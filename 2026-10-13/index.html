<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>2026-10-13 科普绘本《雨鞋的小门》</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #202a31; color: #fff; font-family: system-ui, sans-serif; }
    body { overflow: hidden; }
    main { height: 100dvh; padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) calc(8vh + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 10px; }
    .stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    img { width: 100%; height: 100%; object-fit: contain; display: block; }
    nav { flex: 0 0 48px; display: flex; justify-content: center; align-items: center; gap: 22px; }
    button, a { min-height: 44px; border-radius: 10px; padding: 10px 18px; background: #fff1d8; color: #24333b; border: none; font: inherit; text-decoration: none; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    output { min-width: 72px; text-align: center; }
    @media (max-width: 540px) { nav { gap: 10px; } button, a { padding: 10px; } }
  </style>
</head>
<body>
  <main aria-label="逐页绘本阅读器">
    <div class="stage"><img id="page" src="page-01.png" alt="绘本封面：雨鞋的小门"></div>
    <nav aria-label="翻页">
      <a href="../">书架</a>
      <button id="previous" type="button" disabled>上一页</button>
      <output id="counter" aria-live="polite">1 / 11</output>
      <button id="next" type="button">下一页</button>
    </nav>
  </main>
  <script>
    const pages = Array.from({ length: 11 }, (_, index) => `page-${String(index + 1).padStart(2, '0')}.png`);
    const image = document.getElementById('page');
    const previous = document.getElementById('previous');
    const next = document.getElementById('next');
    let current = 0;
    function show(index) {
      current = Math.max(0, Math.min(pages.length - 1, index));
      image.src = pages[current];
      image.alt = current === 0 ? '绘本封面：雨鞋的小门' : `绘本第${current + 1}页，故事文字已印在图片中`;
      document.getElementById('counter').textContent = `${current + 1} / ${pages.length}`;
      previous.disabled = current === 0;
      next.disabled = current === pages.length - 1;
    }
    previous.addEventListener('click', () => show(current - 1));
    next.addEventListener('click', () => show(current + 1));
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') show(current - 1);
      if (event.key === 'ArrowRight') show(current + 1);
    });
    let touchStart;
    image.addEventListener('touchstart', event => { touchStart = event.changedTouches[0].clientX; }, { passive: true });
    image.addEventListener('touchend', event => {
      if (touchStart === undefined) return;
      const distance = event.changedTouches[0].clientX - touchStart;
      if (Math.abs(distance) > 45) show(current + (distance < 0 ? 1 : -1));
      touchStart = undefined;
    }, { passive: true });
  </script>
</body>
</html>
