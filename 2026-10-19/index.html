<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>月亮没有走丢</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#202d43;color:#fff;font-family:system-ui}main{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) 42px;gap:6px;padding:8px 10px calc(8vh + env(safe-area-inset-bottom))}#page{width:100%;height:100%;object-fit:contain;min-height:0;display:block}nav{display:flex;gap:18px;justify-content:center;align-items:center}button{border:0;border-radius:9px;padding:9px 22px;min-height:40px;background:#f4dfb7;color:#202d43;font-size:16px}button:disabled{opacity:.4}#counter{min-width:70px;text-align:center}</style></head>
<body><main><img id="page" src="page-01.png" alt=""><nav aria-label="翻页"><button id="prev">上一页</button><span id="counter"></span><button id="next">下一页</button></nav></main><script>
const prose=["《月亮没有走丢》 傍晚，小熊猫团团跟青山爸爸出门买酸奶。一弯月亮挂在屋顶上，像刚剥开的橘子瓣。团团仰起脸：“回家我要把它画给奶奶看。”","团团提着空空的布袋，走几步就望一眼月亮。到了街角，店门已经关了。爸爸说：“我们去前面那家看看。”团团点点头，拉住爸爸的手。","他们沿着人行道走到一幢红房子旁。团团忽然停住：“月亮呢？”他往刚才的方向找，眼前只有高高的屋檐，连那一点亮边也没有了。","“它是不是走了？我的画还没画呢。”团团的声音低下来。爸爸停在他身旁，没有催他：“你很想记住今晚的月亮。我们先看看，是什么挡在前面。”","团团眯起眼，伸爪指向红房子：“这里只有房子。”爸爸点头：“房子挡在我们和月亮中间，这里就看不见它。我们换个安全的位置试试。”","爸爸牵着团团，沿平坦的人行道走过屋角。团团一直望着同一片天空。走到爸爸身旁时，一点银光从屋檐边露出来，慢慢又成了完整的月牙。","“它还在！”团团高兴得把布袋抱进怀里。爸爸笑了：“不是月亮钻过房子，是我们走到了能看见它的地方。”团团看看屋角，又看看月亮。","在爸爸身边，团团向墙边退了两小步，月亮又被挡住；再走回来，月牙又露出来。“原来是这里看不见，那边看得见！”他轻声说，像发现了一个小秘密。","另一家店还亮着灯。买好酸奶，团团把布袋交给爸爸，自己牵住爸爸空出的手。回家的路上，月亮又暂时藏进屋后，他这回没有着急。","到家后，团团画了一弯月亮，又在旁边画上红房子和两个小小的身影。他把纸推给爸爸：“给奶奶看。月亮没有走丢，我们只是换了一个地方看它。”"];let current=0;const picture=document.getElementById('page'),prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');
function show(){picture.src='page-'+String(current+1).padStart(2,'0')+'.png';picture.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}
function move(delta){current=Math.max(0,Math.min(prose.length-1,current+delta));show()}
prev.onclick=()=>move(-1);next.onclick=()=>move(1);document.onkeydown=e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)};let start;picture.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});picture.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)move(delta<0?1:-1)},{passive:true});show();
</script></body></html>
