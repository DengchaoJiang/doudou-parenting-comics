<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>银星螺帽躲到哪里了</title>
  <style>
    :root { color-scheme:dark; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; background:#2b241b; color:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(#594229,#211b16); }
    main { width:min(100vw,1180px); padding:12px; }
    .stage { position:relative; aspect-ratio:4/3; width:100%; max-height:calc(100vh - 76px); margin:auto; overflow:hidden; border-radius:10px; background:#000; box-shadow:0 18px 60px #0009; }
    .page { position:absolute; inset:0; display:none; }
    .page.active { display:block; }
    img { width:100%; height:100%; object-fit:cover; display:block; }
    nav { display:flex; justify-content:space-between; align-items:center; padding-top:10px; }
    button { min-width:100px; min-height:42px; border:0; border-radius:9px; background:#e8b84f; color:#2d261c; font:inherit; font-weight:700; }
    button:disabled { opacity:.4; }
  </style>
</head>
<body>
  <main>
    <section class="stage" aria-label="银星螺帽躲到哪里了">
      <article class="page active"><img src="page-01.png" alt="栗栗造好蓝色星星拖车，却发现最后一颗银星螺帽不见了。"></article>
      <article class="page"><img src="page-02.png" alt="栗栗急得满地转，阿松先请他停住脚。"></article>
      <article class="page"><img src="page-03.png" alt="父子回想螺帽从桌边掉落和滚动的方向。"></article>
      <article class="page"><img src="page-04.png" alt="父子把地面分成桌脚、地毯和柜下三个搜索区。"></article>
      <article class="page"><img src="page-05.png" alt="栗栗找到一颗圆豆子，也完成了第一块区域的检查。"></article>
      <article class="page"><img src="page-06.png" alt="栗栗用贴近地面的手电光搜索黑暗的柜子下面。"></article>
      <article class="page"><img src="page-07.png" alt="银光刚出现，就被打喷嚏的灰尘团吹远了。"></article>
      <article class="page"><img src="page-08.png" alt="栗栗用纸板堵住出口，再有次序地往回搜索。"></article>
      <article class="page"><img src="page-09.png" alt="银星螺帽被装回车轮，蓝色拖车稳稳跑过木桥。"></article>
      <article class="page"><img src="page-10.png" alt="夜里拖车停进黄色车库，阿松紧紧抱住栗栗。"></article>
    </section>
    <nav aria-label="翻页"><button id="prev" type="button">上一页</button><span><span id="current">1</span> / 10</span><button id="next" type="button">下一页</button></nav>
  </main>
  <script>
    const pages=[...document.querySelectorAll('.page')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),current=document.querySelector('#current');let index=0;
    function render(){pages.forEach((p,i)=>p.classList.toggle('active',i===index));current.textContent=index+1;prev.disabled=index===0;next.disabled=index===pages.length-1;}
    prev.onclick=()=>{index=Math.max(0,index-1);render();};next.onclick=()=>{index=Math.min(pages.length-1,index+1);render();};
    addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight'||e.key===' ')next.click();});render();
  </script>
</body>
</html>
