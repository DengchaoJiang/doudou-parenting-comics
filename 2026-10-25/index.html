<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小蘑菇慢慢落</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#e9eee8;color:#253b3c;font-family:system-ui}main{height:100dvh;padding:12px 12px calc(8vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px}#page{width:100%;height:calc(100% - 52px);min-height:0;object-fit:contain}nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:20px}button{font:inherit;background:#fffdf1;border:1px solid #658080;border-radius:10px;min-width:76px;height:42px;cursor:pointer}button:disabled{opacity:.4}#counter{min-width:55px;text-align:center}</style></head>
<body><main><img id="page" alt=""><nav aria-label="绘本翻页"><button id="prev">上一页</button><span id="counter" aria-live="polite"></span><button id="next">下一页</button></nav></main>
<script>const prose=["小蘑菇慢慢落\n风把窗外的树梢吹得东摇西晃，小獾冬冬和石川爸爸留在屋里。冬冬找出一顶黄色玩具降落伞，伞下吊着软软的小飞行员：“今天，我们在家飞！”","他把伞布揉成一小团，连着小飞行员往上送。啪嗒，小飞行员很快落到垫子上，黄色伞布还缩成一团。“怎么一下就到了？我想让它慢慢飞。”","冬冬举高手，瞄向头顶的灯。爸爸轻轻挡住：“这里不能往灯上扔。我们站在地上，从我的肩膀下面放手。”冬冬垂下手：“可是，这样会不会飞得更快？”","爸爸把垫子旁的积木移开，扶住玩具，让冬冬看看伞面。“刚才这顶小伞，还没有打开呢。”冬冬拉住布边，爸爸帮他理顺短绳，黄色小伞舒展开了。","冬冬先握住伞布，把小飞行员垂在下面。“松开后，你猜会怎么样？”爸爸问。“我希望它别像小石头！”冬冬盯住小伞，慢慢松开了手。","黄色伞面鼓起来，像一朵小蘑菇。小飞行员晃了晃，没有直冲下去，而是慢悠悠落到垫子。“它真的变慢了！”冬冬蹲在旁边，眼睛睁得圆圆的。","“我们周围有看不见的空气。”爸爸张开手，“小伞往下落时，展开的伞面受到空气的阻力，落得就慢些。”冬冬想了想：“原来不是把它扔高，它才肯慢慢来呀。”","他们又试了一次，冬冬想跳过去接，脚下却一滑，坐到了地上。爸爸立刻收住玩具，蹲下来抱他，轻轻检查：“先看看你哪里疼，小伞可以等。”","冬冬靠在爸爸怀里，缓了一会儿，指指垫子：“这回我不追它，我站旁边看。”爸爸确认他愿意、也能舒服地站好，才从同样的低处放手。小伞又展开，稳稳落下。","看完这一回，冬冬揉揉眼睛：“今天先不玩了。”爸爸和他把伞布、短绳与小飞行员一起收好。冬冬摸摸盒盖：“小蘑菇下次再开。”窗外风还在吹，屋里，爸爸的怀抱正等着他。"];let current=0;const page=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),counter=document.querySelector('#counter');function show(){page.src='page-'+String(current+1).padStart(2,'0')+'.png';page.alt=prose[current];counter.textContent=(current+1)+' / '+prose.length;prev.disabled=current===0;next.disabled=current===prose.length-1}prev.onclick=()=>{if(current>0){current--;show()}};next.onclick=()=>{if(current<prose.length-1){current++;show()}};document.onkeydown=e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()};show();</script></body></html>
