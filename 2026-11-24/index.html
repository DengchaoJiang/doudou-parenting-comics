<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>会抱桶的垃圾车</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#282f3b;color:#fff6e4;font:18px system-ui}
main{height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:0 8px calc(8vh + env(safe-area-inset-bottom))}
img{object-fit:contain;max-width:100%;max-height:calc(100dvh - 8vh - env(safe-area-inset-bottom) - 60px)}
nav{height:44px;flex-shrink:0;display:flex;align-items:center;gap:14px}a{color:#f4e0b3;padding:10px 3px}
button{min-height:44px;border:0;border-radius:8px;padding:0 13px;background:#f4e0b3;color:#282f3b;font:inherit}
button:disabled{opacity:.5}
</style></head><body><main><img id="page" src="page-01.webp" alt=""><nav aria-label="绘本阅读"><a href="../">首页</a><button id="prev">上一页</button><span id="count" aria-live="polite"></span><button id="next">下一页</button></nav></main>
<script>
const files=["page-01.webp","page-02.webp","page-03.webp","page-04.webp","page-05.webp","page-06.webp","page-07.webp","page-08.webp","page-09.webp","page-10.webp"],prose=["一阵风吹过窗台。小企鹅冬点捡起几团软纸，装进绿玩具桶。他把小桶推到橙色玩具车旁，准备出车。","冬点把绿桶搁在玩具车的小臂上，轻轻一转旋钮。咕咚！小桶掉了，软纸球滚得桌上到处都是。","爸爸岩舟拢住滚到桌边的纸球。窗外响起车轮声，他招招手，邀冬点到窗前看看今天来的是哪辆车。","父子俩隔着窗往外看。一辆橙色垃圾车停在大绿桶旁，车身侧面伸出一条粗粗的机械臂。","机械臂尖的两片夹爪慢慢合拢，把大绿桶抱在中间。冬点也把两只小翅膀合起来，跟着比了比。","车臂提起桶，转到车顶的大槽上方。桶口一朝下，垃圾就落进槽里。冬点隔着窗，看得眼睛都圆了。","车臂把空桶转回来，等绿桶稳稳站到地上才松开。冬点朝爸爸一笑。他知道刚才为什么会掉桶了。","回到木桌旁，冬点把纸球装回小桶，让玩具车的夹爪夹住桶身。他再转旋钮，小桶跟着小臂升了起来。","桶口转过来，纸球啪嗒啪嗒落进车槽。冬点把空桶转回桌面，等桶底站稳，才轻轻松开夹爪。","冬点拍了拍小翅膀，笑着说第一趟送到啦。车轮声走远了，他把绿小桶推到亮处，等着下一趟。"];
const page=document.querySelector('#page'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),count=document.querySelector('#count');
let current=0,start;
function show(i){
 current=Math.min(files.length-1,Math.max(0,i)); page.src=files[current];page.alt=prose[current];count.textContent=(current+1)+' / '+files.length;prev.disabled=current===0;next.disabled=current===files.length-1;
}
prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
page.addEventListener('touchstart',e=>start=e.changedTouches[0].clientX,{passive:true});
page.addEventListener('touchend',e=>{const n=e.changedTouches[0].clientX-start;if(Math.abs(n)>45)show(current+(n<0?1:-1))},{passive:true});
show(0);
</script></body></html>
